# リポジトリの根の環境の宣言。全体テスト（#1142 の決定 22）と根の scripts/（開発と CI の検査。決定 19）が使う。
# 版は隣の uv.lock が固定する。全体テストは `uv run --frozen --project . --all-extras pytest . -q -n auto` で流す。
# グループ（extra）は plugins/ndf/pyproject.toml の全グループを同じ版で持つ（包みを呼ぶ側のテストが同じプロセスで import する）。
# playwright_kit はパスで指定し、requires-python はそれに合わせて 3.11 以上にする。
# 足す・版を上げるのは、この 2 つを変える PR だけで行う（理由を PR に書く）。
[project]
name = "ai-plugins-dev-scripts"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "playwright_kit",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
]

[project.optional-dependencies]
github = ["githubkit==0.16.1"]
md = ["markdown-it-py==4.2.0", "mdit-py-plugins==0.6.1"]
mdtable = ["tabulate==0.10.0"]
schema = ["pydantic==2.13.5"]
procs = ["psutil==7.2.2"]
locks = ["filelock==4.0.3"]
shparse = ["tree-sitter==0.26.0", "tree-sitter-bash==0.25.1"]
versions = ["semver==3.1.0"]
bump = ["bump-my-version==1.5.1"]
pathmatch = ["pathspec==1.1.1"]
textparse = ["unidiff==1.0.1", "pygments==2.21.0"]
yamlio = ["ruamel-yaml==0.19.1"]
waits = ["tenacity==9.1.4"]
notify = ["slack-sdk==3.44.1", "python-dotenv==1.2.3", "httpx==0.28.1"]
terminal = ["ptyprocess==0.7.0"]
# 耐久の記録（#1142 の決定 34）。DBOS を import するのは lib/durable.py だけ（I16）。実行の鍵の排他に lib/locks.py を使うため filelock も持つ
durable = ["dbos==3.1.0", "filelock==4.0.3"]

[tool.uv]
package = false

[tool.uv.sources]
playwright_kit = { path = "plugins/playwright-kit/skills/playwright-kit-ops", editable = true }

# 検査のツール（#1323 の決定 6）。scripts/check-lint.sh が `uv run --frozen --project . --only-group lint` から起動する。
# 手元と CI とこの版だけを読む。上げるときは、ここと uv.lock を同じ PR で変え（`uv add --group lint ruff==<版>`）、
# 同じ PR で `bash scripts/check-lint.sh` が 0 で終わるまで新しい違反を直すか抑止する。
# cross-refactoring の指標の測定（codemetrics.py）が固定する ruff の版とは共有しない（決定 8）。
[dependency-groups]
lint = [
    "ruff==0.16.9",
    "shellcheck-py==0.11.0.1",
]

# Ruff の設定（#1323）。このリポジトリの開発の検査だけが読む。
# cross-refactoring の指標の測定は --isolated で起動するので、この設定を読まない（決定 8）。
[tool.ruff]
# NDF のスクリプトは利用者の環境で 3.10 以上で動く（plugins/ndf/pyproject.toml）。根の requires-python からの推定に任せない
target-version = "py310"
# ruff は全角の文字を幅 2 と数える。140 は supervise_lib の各ファイルが 500 行の上限
# （test_supervise_layout.py）に収まる最も狭い候補（決定 4）
line-length = 140

[tool.ruff.lint]
# 未定義名・未使用の import・構文に近い誤りを見る規則だけを選ぶ（決定 1）。
# I（import の並べ替え）は、sys.path へ経路を足した後の import の順序を崩すので採らない
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    # sys.path に経路を足してから隣のモジュールを import するのがリポジトリの規約の形（決定 2）
    "E402",
    # l・O などの紛らわしい名前は字形の規則で、誤りではない。名前を変える修正は最小の修正を超える（決定 2）
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# gh_fake のフィクスチャ fake を import し、テストの引数で同じ名前を受ける pytest の形（決定 3）
"plugins/ndf/scripts/tests/test_gh_call.py" = ["F811"]
"plugins/ndf/scripts/tests/test_gh_quota.py" = ["F811"]
"plugins/ndf/scripts/tests/test_gh_rest.py" = ["F811"]
# test_project_mvv のフィクスチャ env を import し、テストの引数で同じ名前を受ける（上と同じ形）
"plugins/ndf/scripts/tests/test_project_mvv_normal.py" = ["F811"]
# account_fake のフィクスチャ accounts も同じ形（#1389）
"plugins/ndf/scripts/tests/test_claude_accounts.py" = ["F811"]
"plugins/ndf/scripts/tests/test_supervise.py" = ["F811"]
"plugins/ndf/scripts/tests/test_relay.py" = ["F811"]
