# scenario-test 共通設定 (pytest-playwright)
#
# 使い方:
#   cp scenario.config.yaml ./scenario.config.yaml
#   uv run pytest --pwk-config=./scenario.config.yaml
#
# pytest が起動する CWD に置けば ``--pwk-config`` 省略も可能。
# 認証情報を含むため .gitignore 推奨。
#
# ⚠️ 認証情報の管理:
#   YAML に直接書かず ${ENV_VAR} / ${ENV_VAR:-default} で参照してください。
#   .env ファイルや shell export で環境変数を設定して使用します。
#   例: export ADMIN_PASSWORD=secret  または  direnv / .env ファイルを活用

# --- ブラウザ接続設定 --------------------------------------------------
# local: playwright install chromium でインストールしたローカルブラウザ (デフォルト)
# cdp-remote: Chrome DevTools Protocol 経由でリモートブラウザに接続
#   → Windows / macOS のホスト Chrome を GUI 付きで操作可能
#   → ログイン済み Session (Google, AWS, Slack 等) をそのまま再利用
#   → 詳細は /ndf:playwright-authoring を参照
browser:
  mode: local
  # cdp-remote 時のみ有効。環境変数で切り替え推奨:
  #   Windows (WSL2 Docker): export CDP_ENDPOINT=http://host-gateway:9222
  #   macOS (Docker Desktop): export CDP_ENDPOINT=http://host.docker.internal:9222
  # cdp_endpoint: ${CDP_ENDPOINT:-http://localhost:9222}

# --- 接続先 ----------------------------------------------------------
target:
  base_url: https://example.com

  # サイト全体に Basic 認証が掛かっている場合のみ指定 (掛かっていなければ削除可)。
  # 省略時は空文字列が入り、role 側で `requires_basic_auth: true` を指定した
  # role のみが Basic 認証ヘッダを要求する。
  # basic_auth:
  #   user: ${BASIC_AUTH_USER}
  #   password: ${BASIC_AUTH_PASSWORD}

# --- TLS 検査 (false で curl -k 相当) ---------------------------
verify_tls: false

# --- ロール別ログイン情報 ---------------------------------------
# pytest テストから ``pwk_role_<id>`` fixture で参照する
roles:
  admin:
    label: 管理者
    login:
      path: /admin/login
      requires_basic_auth: true   # /admin/ 配下のみ Basic 認証ゲートが掛かる場合
      fields:
        # 認証情報は環境変数で管理する (YAML 直書き禁止)
        # export ADMIN_LOGIN_ID=admin@example.com
        # export ADMIN_PASSWORD=secret
        LoginID: ${ADMIN_LOGIN_ID}
        Password: ${ADMIN_PASSWORD}
      # 任意: 独自フォーム名がある場合の優先セレクタ。省略時は role/type=submit
      # の汎用フォールバックを fixture が試行する。
      # submit_selectors:
      #   - 'form[name="MyAdminLoginForm"] button[type="submit"]'
      fail_if_url_contains: /admin/login

  user:
    label: 一般ユーザ
    login:
      path: /user/login
      requires_basic_auth: false
      fields:
        # export USER_LOGIN_ID=user@example.com
        # export USER_PASSWORD=secret
        LoginID: ${USER_LOGIN_ID}
        Password: ${USER_PASSWORD}
      fail_if_url_contains: /user/login

# --- Playwright 設定 -----------------------------------------------
playwright:
  headless: true
  # 1280x720 = HD 720p (16:9)。Google Drive のプレイヤで transcoding 不要で
  # 即時再生しやすい標準解像度。video_size と必ず一致させる。
  viewport:
    width: 1280
    height: 720
  slow_mo_ms: 0
  video_size:
    width: 1280
    height: 720
  navigation_timeout_ms: 30000
  # 各ナビゲーション完了後にこの ms だけ待機する (動画用)。
  step_delay_ms: 1800
  enable_overlay: true
  enable_trace: true
  # mp4 推奨 (Drive プレビュアで再生互換性が高い)。webm にすると変換せず保存。
  video_format: mp4

# --- 許容する console.error / pageerror パターン -------------
# 3rd party SDK の既知 warning など、プロジェクト責任外の noise を許容するときに
# 正規表現で除外できる。マッチした行は ``pwk_evidence`` の集計から除かれる。
tolerated_console_errors: []
tolerated_page_errors: []
# 例:
# tolerated_console_errors:
#   - "Failed to load resource: the server responded with a status of 404"
#   - "ResizeObserver loop limit exceeded"
# tolerated_page_errors:
#   - "ChunkLoadError"

# --- accessibility (axe-core) 自動スキャン ------------------------------------
# ``@pytest.mark.page_role("form")`` 等が付いた test の終了直前に axe-core を
# 自動実行する (page_role が auto_roles にマッチした場合のみ)。
accessibility:
  enabled: true
  auto_roles: [lp, list, form, dashboard, cart, checkout, settings, auth]
  tags: [wcag2a, wcag2aa, wcag21aa, wcag22aa]
  fail_on_violations: true

# --- Core Web Vitals (web_vitals) 自動計測 ----------------------------------------
# page_role が auto_roles にマッチする test の終了直前に LCP/CLS/TTFB/longest_task
# を observe_ms ミリ秒観察する。poor が 1 件でもあれば fail_on_poor=true なら FAIL。
web_vitals:
  enabled: true
  auto_roles: [lp, list, dashboard, search]
  observe_ms: 5000
  fail_on_poor: true

# --- body_check (PHP / SSR エラー検出, v0.4.0) -----------------------
# console.error / pageerror では拾えない、サーバ側で HTML 本文に直接出力された
# "Fatal error" / "Warning:" 等のエラー文字列を検出する。
# - default: enabled=true + PHP 系デフォルトパターン内蔵 (config を書かなくても効く)
# - autouse: page fixture を要求する test に対して page.on("response") 経由で
#   全 HTML レスポンスを監視。@pytest.mark.no_body_check で個別 opt-out 可能
# - 各 test 終了時に case_dir/body_check.jsonl に違反詳細を出力
# - 一切無効化したい場合は body_check.enabled: false を明示
# - パターンを上書きしたい場合のみ下記キーを書く (省略すれば内蔵 default が効く)
# body_check:
#   enabled: true
#   # 本文全体への substring match (1 つでも含まれれば violation)
#   fatal_patterns:
#     - "Fatal error"
#     - "Uncaught"
#     - "Parse error"
#   # 本文の先頭 warning_head_chars 文字のみ走査
#   # (本文中の説明文や入力例の "Notice:" 等を許容)
#   warning_patterns:
#     - "STRICT:"
#     - "Warning:"
#     - "Notice:"
#     - "Deprecated:"
#   warning_head_chars: 300   # (旧名 warning_head_bytes も alias で受理)
#   not_found_patterns:
#     - "File not found"
#   fail_on_match: true   # false にすると情報収集モード (PASS のまま report に出力)

# --- レポート設定 -----------------------------------------------------
# pytest_terminal_summary が ``reports/<run-id>/report.md`` に書き出す
# Markdown のタイトル等。
report:
  title: "シナリオ E2E テスト 実施報告書"
  test_plan_link: "./test-plan.md"
  phase_labels: {}
