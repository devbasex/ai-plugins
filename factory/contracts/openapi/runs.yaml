openapi: 3.1.0
info:
  title: Neural Development Factory のスプリントの実行の API
  version: 0.1.0
  description: >-
    画面向けの取り込み・キーの持ち込み・課題の候補・スプリントの実行の経路と、ランナー向けの経路（#2186）。
    画面向けは Cognito の access token、ランナー向け（/run-jobs/*）は実行ジョブの token を Authorization: Bearer で要る。
    再開の要求と形態 local の渡す口は HTTP の経路にせず、factory/api/src/index.ts の関数で呼ぶ。
  contact:
    name: devbasex/ai-plugins
    url: https://github.com/devbasex/ai-plugins
  license:
    name: MIT
    url: https://github.com/devbasex/ai-plugins/blob/main/factory/LICENSE
servers:
  - url: https://api.example.com
    description: API の入口（値はインフラが FACTORY_API_URL で渡す。/run-jobs/* は INGEST_URL と同じ origin）
tags:
  - name: repositories
    description: リポジトリの登録
  - name: credentials
    description: キーの持ち込み
  - name: sprint-runs
    description: 課題の候補とスプリントの実行
  - name: run-jobs
    description: ランナー向けの経路
security:
  - cognito: []
paths:
  /accounts/{accountId}/github/install-url:
    get:
      tags: [repositories]
      operationId: getInstallUrl
      summary: GitHub App の導入の画面の URL
      description: 利用者が自分のリポジトリへ GitHub App を入れる画面の URL を返す。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Url"
        "403":
          $ref: "#/components/responses/E403"
  /accounts/{accountId}/github/authorize-url:
    get:
      tags: [repositories]
      operationId: getAuthorizeUrl
      summary: GitHub App の利用者の認可の URL
      description: state は利用者とアカウントを署名した 10 分の値。持ち主だけが使える。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Url"
        "403":
          $ref: "#/components/responses/E403"
  /accounts/{accountId}/github/candidates:
    post:
      tags: [repositories]
      operationId: postRepositoryCandidates
      summary: 認可の戻りから登録の候補を返す
      description: 導入の対象で利用者の届くリポジトリと、10 分の候補の証明を返す。利用者の token は保存しない。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidatesRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryCandidates"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
  /accounts/{accountId}/repositories:
    get:
      tags: [repositories]
      operationId: listRepositories
      summary: 登録したリポジトリの一覧
      description: リポジトリごとの終わりの状態でないスプリントの実行の数を添える。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryList"
        "403":
          $ref: "#/components/responses/E403"
    post:
      tags: [repositories]
      operationId: registerRepository
      summary: リポジトリを登録する
      description: 候補の証明と、登録の直前の導入の token の作成で確かめる（I33）。同じリポジトリは 409（I32）。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "409":
          $ref: "#/components/responses/E409"
  /accounts/{accountId}/model-credential:
    get:
      tags: [credentials]
      operationId: getModelCredential
      summary: 持ち込んだキーの有無
      description: 登録済みか・種類・更新の時刻・外部 ID だけを返し、値も置き場の ARN も返さない（I38）。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredential"
        "403":
          $ref: "#/components/responses/E403"
    put:
      tags: [credentials]
      operationId: putModelCredential
      summary: キーを保存・差し替える
      description: Anthropic API キーか AWS のロールの ARN と地域のどちらか 1 つ。持ち主だけが使える。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCredentialInput"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredential"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "503":
          $ref: "#/components/responses/E503"
    delete:
      tags: [credentials]
      operationId: deleteModelCredential
      summary: 持ち込んだキーを消す
      description: 復元の期間を置かずに消す（決定 14）。無くても 204。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 成功
        "403":
          $ref: "#/components/responses/E403"
        "503":
          $ref: "#/components/responses/E503"
  /accounts/{accountId}/repositories/{repositoryId}/issue-candidates:
    post:
      tags: [sprint-runs]
      operationId: postIssueCandidates
      summary: AI が選んだ課題の候補
      description: 棚卸しの順位の表（無ければ開いている課題の新しい順）から、サービスの Bedrock で採否と理由を作る。保存しない。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: repositoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCandidatesRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueCandidates"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
  /accounts/{accountId}/sprint-runs:
    post:
      tags: [sprint-runs]
      operationId: startSprintRun
      summary: スプリントの実行を始める
      description: >-
        確かめの順は 課題（400）→ 登録（404）→ キー（409）→ 導入（409）→ 使える量（409）。
        課題が動いているループのマイルストーンに属すると 409 issue_in_loop（details.numbers・details.loop_name）、
        同じリポジトリの終わりの状態でない実行が持つ課題を指すと 409 issue_in_use（details.numbers）、
        並行を許さない版どうしなら 409 parallel_unsupported_version。limits_exceeded の reasons に concurrent_repo_runs がある（#2347）。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintRunStarted"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
    get:
      tags: [sprint-runs]
      operationId: listSprintRuns
      summary: スプリントの実行の一覧
      description: 新しい順に 50 件。repository_id で絞れる。各行の今のフェーズ・今の工程・最後の動きは進捗の事象から導く。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: repository_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintRunList"
        "403":
          $ref: "#/components/responses/E403"
  /accounts/{accountId}/sprint-runs/{sprintRunId}:
    get:
      tags: [sprint-runs]
      operationId: getSprintRunDetail
      summary: スプリントの詳細
      description: >-
        フェーズの欄・課題ごとの工程の記録と Pull Request と CI・承認の欄・使用量。進捗の事象から導き、課題の本文・ボード・GitHub を読まない。
        工程の中身の本文（触ったファイル・決めたこと・出力）は返さず、工程の中身の経路で 1 件ずつ読む。
        step.recorded は新しい方から 2,000 件までで、省いた数を omitted_steps に返す。
        無い実行・アカウントに属さない実行も、他人のアカウントと同じ本文の 403。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: sprintRunId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintRunDetail"
        "403":
          $ref: "#/components/responses/E403"
        "503":
          $ref: "#/components/responses/E503"
  /accounts/{accountId}/sprint-runs/{sprintRunId}/steps/{stepKey}:
    get:
      tags: [sprint-runs]
      operationId: getStepDetail
      summary: 工程の中身
      description: >-
        1 件の工程の記録の、触ったファイル・コミットの範囲・決めたこと・出力（作業の報告かログ）と、差分とファイルのリンク。
        stepKey は事象の idempotency_key（URL の符号化をする）。記録の無い項目は null。
        無い工程・別の実行の工程も、他人のアカウントと同じ本文の 403。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: sprintRunId
          in: path
          required: true
          schema:
            type: string
        - name: stepKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepDetail"
        "403":
          $ref: "#/components/responses/E403"
        "503":
          $ref: "#/components/responses/E503"
  /accounts/{accountId}/repositories/{repositoryId}/backlog:
    get:
      tags: [repositories]
      operationId: getBacklog
      summary: バックログ
      description: >-
        リポジトリの着手の順位の表（マイルストーンの説明の表）と、そのリポジトリの実行（新しい順に 50 件まで）の棚卸しの工程の記録。
        読むだけで、課題・マイルストーン・ボードへ書かない。登録の無いリポジトリも、他人のアカウントと同じ本文の 403。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: repositoryId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backlog"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "503":
          $ref: "#/components/responses/E503"
  /accounts/{accountId}/sprint-runs/{sprintRunId}/cancel:
    post:
      tags: [sprint-runs]
      operationId: cancelSprintRun
      summary: スプリントの実行を取り消す
      description: 動いている実行ジョブがあれば止め、停止の後に cancelled へ移す。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: sprintRunId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResult"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
  /run-jobs/github-token:
    post:
      tags: [run-jobs]
      operationId: postRunJobGitHubToken
      summary: 導入の token の渡し直し
      description: 実行ジョブの token で認証し、その実行のリポジトリ 1 つに絞った 1 時間の導入の token を返す（決定 7）。
      security:
        - runJob: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubToken"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "409":
          $ref: "#/components/responses/E409"
  /run-jobs/state:
    post:
      tags: [run-jobs]
      operationId: postRunJobState
      summary: 状態の置き場の署名つき URL
      description: その実行の鍵だけの 15 分の URL を返す（決定 8）。get で保存が無ければ 404。
      security:
        - runJob: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedUrl"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
  /run-jobs/approval-requests/{approvalRequestId}/answer:
    get:
      tags: [run-jobs]
      operationId: getRunJobApprovalAnswer
      summary: 承認の依頼への人の答え
      description: >-
        resume の実行ジョブが、起動の指示の APPROVAL_REQUEST_ID で人の答えを 1 回だけ読む。実行ジョブの token で認証し、
        その実行の依頼でなければ 403、答えがまだ無ければ 409。sprint.json の置き場は返さない
        （ランナーが復元した状態から求める）。答えを保存する側の実装は #2173。
      security:
        - runJob: []
      parameters:
        - name: approvalRequestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAnswer"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
  /accounts/{accountId}/repositories/{repositoryId}:
    patch:
      tags: [repositories]
      operationId: updateRepository
      summary: リポジトリの同時の実行の数を宣言する
      description: 料金プランの同時の数より小さい値だけが効く。null は宣言を外す。持ち主だけが使える（#2347）。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: repositoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryUpdate"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
    delete:
      tags: [repositories]
      operationId: removeRepository
      summary: リポジトリの登録を外す
      description: 終わりの状態でないスプリントの実行があれば 409（I36）。持ち主だけが使える。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: repositoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 成功
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
  /run-jobs/organizer/answers:
    get:
      tags: [run-jobs]
      operationId: getRunJobOrganizerAnswers
      summary: 配布の依頼の答えと配布済みの範囲
      description: >-
        実行ジョブの token で認証し、そのジョブの実行のレーン（ループならループのすべての実行）の配布の依頼の答えと、
        リポジトリの配布済みの範囲を返す（#2439）。ランナーは NDF の置き場の answers/ と ranges/ へそのまま書く。
      security:
        - runJob: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerAnswers"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
  /run-jobs/organizer/batch:
    get:
      tags: [run-jobs]
      operationId: getRunJobOrganizerBatch
      summary: 配布の実行のまとめた配布の中身
      description: >-
        配布の実行のジョブの token だけが読める（ほかの実行は 403）。レーンの一覧と依頼、提示、選択肢と、
        このジョブの手（step）を返す。ランナーは NDF の置き場の batch.json へそのまま書く（#2439）。
      security:
        - runJob: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerBatch"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      description: Cognito の access token
    runJob:
      type: http
      scheme: bearer
      description: 実行ジョブの token
  responses:
    E400:
      description: 要求の形が違う
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E401:
      description: 認証できない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E403:
      description: 権限が無い（他人のアカウントと同じ本文）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E404:
      description: 見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E409:
      description: 状態が合わない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E503:
      description: 時間をおいてやり直す
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
    Url:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    CandidatesRequest:
      type: object
      required: [code, state]
      properties:
        code: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
    RepositoryCandidates:
      type: object
      required: [proof, candidates]
      properties:
        proof: { type: string }
        candidates:
          type: array
          items:
            type: object
            required: [repository_id, full_name, installation_id, registered]
            properties:
              repository_id: { type: integer }
              full_name: { type: string }
              installation_id: { type: integer }
              registered: { type: boolean }
    RegisterRequest:
      type: object
      required: [proof, repository_id]
      properties:
        proof: { type: string }
        repository_id: { type: integer, minimum: 1 }
    Repository:
      type: object
      required: [repository_id, full_name, installation_id, registered_at]
      properties:
        repository_id: { type: integer }
        full_name: { type: string }
        installation_id: { type: integer }
        registered_at: { type: string, format: date-time }
        active_sprint_runs: { type: integer, minimum: 0 }
        max_concurrent_runs: { type: ["integer", "null"], minimum: 1, maximum: 100 }
    RepositoryUpdate:
      type: object
      required: [max_concurrent_runs]
      additionalProperties: false
      properties:
        max_concurrent_runs: { type: ["integer", "null"], minimum: 1, maximum: 100 }
    RepositoryList:
      type: object
      required: [repositories]
      properties:
        repositories:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
    ModelCredential:
      type: object
      required: [registered, kind, updated_at, external_id]
      properties:
        registered: { type: boolean }
        kind: { type: ["string", "null"], enum: [anthropic_api_key, aws_role, null] }
        updated_at: { type: ["string", "null"], format: date-time }
        external_id: { type: string }
    ModelCredentialInput:
      oneOf:
        - type: object
          required: [kind, api_key]
          additionalProperties: false
          properties:
            kind: { const: anthropic_api_key }
            api_key: { type: string, minLength: 1, maxLength: 512 }
        - type: object
          required: [kind, role_arn, region]
          additionalProperties: false
          properties:
            kind: { const: aws_role }
            role_arn: { type: string, maxLength: 2048, pattern: "^arn:aws[a-z-]*:iam::\\d{12}:role/.+$" }
            region: { type: string, maxLength: 32, pattern: "^[a-z]{2}(-[a-z]+)+-\\d$" }
    IssueCandidatesRequest:
      type: object
      properties:
        exclude:
          type: array
          items: { type: integer, minimum: 1 }
    IssueCandidates:
      type: object
      required: [source, milestone, candidates, note]
      properties:
        source: { type: string, enum: [ranking, recent] }
        milestone: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        candidates:
          type: array
          items:
            type: object
            required: [number, title, selected, reason]
            properties:
              number: { type: integer }
              title: { type: string }
              selected: { type: boolean }
              reason: { type: string, minLength: 1 }
    StartRequest:
      type: object
      required: [repository_id, issues]
      properties:
        repository_id: { type: integer, minimum: 1 }
        issues:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    SprintRunStarted:
      type: object
      required: [sprint_run_id, state]
      properties:
        sprint_run_id: { type: string }
        state: { const: starting }
    SprintRunList:
      type: object
      required: [sprint_runs]
      properties:
        sprint_runs:
          type: array
          items:
            type: object
            required: [sprint_run_id, repository_id, issues, state, failure_reason, created_at]
            properties:
              sprint_run_id: { type: string }
              repository_id: { type: integer }
              issues: { type: array, items: { type: integer } }
              state: { type: string, enum: [starting, running, awaiting_approval, awaiting_reset, done, stopped, failed, cancelled] }
              failure_reason: { type: ["string", "null"] }
              created_at: { type: string, format: date-time }
              repo: { type: string, description: owner/name }
              current_phase:
                type: ["string", "null"]
                description: 最後の phase.changed のフェーズの名前。null は始まる前。5 つの名前に無い値もそのまま返す
              current_step: { type: ["string", "null"], description: 最後の step.recorded のステップ }
              last_event_at: { type: ["string", "null"], format: date-time, description: 最後の事象の時刻 }
    PullRequestLink:
      type: object
      required: [repo, number, url]
      properties:
        repo: { type: string }
        number: { type: integer }
        url: { type: string, format: uri }
    StepRow:
      type: object
      required: [key, at, job_id, step, phase, issues, exit_code, seconds, cost_usd, summary, pull_request, has_details]
      properties:
        key: { type: string, description: 事象の idempotency_key }
        at: { type: string, format: date-time }
        job_id: { type: ["string", "null"] }
        step: { type: string }
        phase: { type: ["string", "null"], description: 工程のフェーズ。無ければ同じ実行ジョブの直前の phase.changed から導く }
        issues: { type: array, items: { type: integer }, description: 空はスプリント全体の工程 }
        exit_code: { type: integer }
        seconds: { type: number }
        cost_usd: { type: ["number", "null"], description: 同じ実行ジョブ・ステップ・時刻の usage.recorded の和。結べなければ null }
        summary: { type: string }
        pull_request:
          oneOf:
            - $ref: "#/components/schemas/PullRequestLink"
            - type: "null"
        has_details: { type: boolean, description: 工程の中身の本文を持つか }
    RequiredStep:
      type: object
      required: [label, step, record]
      properties:
        label: { type: string }
        step: { type: string }
        record:
          oneOf:
            - type: object
              required: [key, exit_code, seconds]
              properties:
                key: { type: string }
                exit_code: { type: integer }
                seconds: { type: number }
            - type: "null"
    GateView:
      type: object
      required: [state, at]
      properties:
        state: { type: string, enum: [not_reached, waiting, approved, rejected] }
        at: { type: ["string", "null"], format: date-time }
    SprintRunDetail:
      type: object
      required:
        - sprint_run_id
        - repository_id
        - issues
        - state
        - failure_reason
        - created_at
        - repo
        - ndf_version
        - execution_mode
        - job_count
        - current_phase
        - phases
        - columns
        - steps
        - gates
        - delegated_decisions
        - usage
        - omitted_steps
      properties:
        sprint_run_id: { type: string }
        repository_id: { type: integer }
        issues: { type: array, items: { type: integer } }
        state: { type: string, enum: [starting, running, awaiting_approval, awaiting_reset, done, stopped, failed, cancelled] }
        failure_reason: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        repo: { type: string }
        ndf_version: { type: string }
        execution_mode: { type: string, enum: [local, byok, managed] }
        job_count: { type: integer }
        current_phase: { type: ["string", "null"] }
        phases:
          type: array
          description: 5 つの名前（設計・実装・検査・取り込み・仕上げ）の順に、続いて現れた順に 5 つに無い名前。仕上げだけが required（振り返り・棚卸し）を持つ
          items:
            type: object
            required: [name, step_keys, required]
            properties:
              name: { type: string }
              step_keys: { type: array, items: { type: string } }
              required: { type: array, items: { $ref: "#/components/schemas/RequiredStep" } }
        columns:
          type: array
          description: 実行の課題の順に課題の欄、最後にスプリント全体の欄（issue が null）
          items:
            type: object
            required: [issue, step_keys, pull_requests]
            properties:
              issue: { type: ["integer", "null"] }
              step_keys: { type: array, items: { type: string } }
              pull_requests:
                type: array
                items:
                  type: object
                  required: [repo, number, url, state, checks]
                  properties:
                    repo: { type: string }
                    number: { type: integer }
                    url: { type: string, format: uri }
                    state: { type: string, enum: [open, closed, merged, unknown] }
                    checks:
                      type: array
                      items:
                        type: object
                        required: [name, conclusion]
                        properties:
                          name: { type: string }
                          conclusion: { type: ["string", "null"], description: null は実行中 }
        steps: { type: array, items: { $ref: "#/components/schemas/StepRow" } }
        gates:
          type: object
          required: [gate1, gate2, decision]
          properties:
            gate1: { $ref: "#/components/schemas/GateView" }
            gate2: { $ref: "#/components/schemas/GateView" }
            decision:
              type: object
              required: [state, at]
              properties:
                state: { type: string, enum: [none, waiting, answered] }
                at: { type: ["string", "null"], format: date-time }
        delegated_decisions: { type: integer, description: AI が代わりに判断した問い合わせの数 }
        usage:
          type: object
          required: [input_tokens, output_tokens, cost_usd]
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cost_usd: { type: number }
        omitted_steps: { type: integer, description: 上限で省いた古い工程の数 }
    StepDetail:
      allOf:
        - $ref: "#/components/schemas/StepRow"
        - type: object
          required: [files, files_omitted, commit_range, decisions, output, diff_url]
          properties:
            files:
              type: ["array", "null"]
              description: null は記録なし、空の配列は触らなかった
              items:
                type: object
                required: [path, added, deleted, url]
                properties:
                  path: { type: string }
                  added: { type: ["integer", "null"], description: null はバイナリ }
                  deleted: { type: ["integer", "null"], description: null はバイナリ }
                  url: { type: ["string", "null"], format: uri, description: コミットの範囲が無ければ null }
            files_omitted: { type: ["integer", "null"] }
            commit_range:
              oneOf:
                - type: object
                  required: [from, to]
                  properties:
                    from: { type: string }
                    to: { type: string }
                - type: "null"
            decisions:
              type: ["array", "null"]
              items:
                type: object
                required: [question, answer, by]
                properties:
                  question: { type: string }
                  answer: { type: string }
                  by: { type: string, enum: [ai, user] }
            output:
              oneOf:
                - type: object
                  required: [kind, text, truncated]
                  properties:
                    kind: { type: string, enum: [report, log] }
                    text: { type: string }
                    truncated: { type: boolean }
                - type: "null"
            diff_url: { type: ["string", "null"], format: uri }
    Backlog:
      type: object
      required: [repository_id, repo, ranking, refinements]
      properties:
        repository_id: { type: integer }
        repo: { type: string }
        ranking:
          description: null は順位の表が無い
          oneOf:
            - type: object
              required: [milestone, rows]
              properties:
                milestone: { type: string }
                rows:
                  type: array
                  items:
                    type: object
                    required: [rank, number, title]
                    properties:
                      rank: { type: integer, minimum: 1 }
                      number: { type: integer }
                      title: { type: string }
            - type: "null"
        refinements:
          type: array
          description: 棚卸しの工程（step が refine）の記録を新しい順に
          items:
            type: object
            required: [sprint_run_id, key, at, exit_code, summary, pull_request]
            properties:
              sprint_run_id: { type: string }
              key: { type: string }
              at: { type: string, format: date-time }
              exit_code: { type: integer }
              summary: { type: string }
              pull_request:
                oneOf:
                  - $ref: "#/components/schemas/PullRequestLink"
                  - type: "null"
    CancelResult:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [cancelled, running] }
    GitHubToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    StateRequest:
      type: object
      required: [op]
      properties:
        op: { type: string, enum: [put, get] }
    ApprovalAnswer:
      type: object
      required: [kind]
      description: >-
        kind が gate1 / gate2 なら decision が要り、ランナーはスプリント状態ファイルへ sprint-state.py gate で
        gate（無ければ kind を NDF の記録の名前へ写した「関門 1」/「関門 2」）の名前で書く。rejected なら差し戻しと
        body を conductor の再開の指示へ渡す。decision なら body を conductor への利用者の判断として渡す。
      properties:
        kind: { type: string, enum: [gate1, gate2, decision] }
        decision: { type: string, enum: [approved, rejected] }
        body: { type: ["string", "null"], description: 承認の理由か判断の本文 }
        gate: { type: string, description: スプリントの状態に書く関門の名前（省略時は kind から「関門 1」/「関門 2」） }
    SignedUrl:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    OrganizerAnswer:
      type: object
      required: [request_id, result, version, release, reason, at]
      properties:
        request_id: { type: string }
        result: { type: string, enum: [released, rejected] }
        version: { type: ["string", "null"] }
        release: { type: ["string", "null"], description: 本番の Pull Request の URL }
        reason: { type: ["string", "null"] }
        at: { type: string, format: date-time }
    OrganizerRange:
      type: object
      required: [seq, sha, version, prs, lanes]
      properties:
        seq: { type: integer }
        sha: { type: ["string", "null"] }
        version: { type: ["string", "null"] }
        prs: { type: array, items: { type: integer } }
        lanes: { type: array, items: { type: string } }
    OrganizerAnswers:
      type: object
      required: [answers, ranges]
      properties:
        answers: { type: array, items: { $ref: "#/components/schemas/OrganizerAnswer" } }
        ranges: { type: array, items: { $ref: "#/components/schemas/OrganizerRange" } }
    OrganizerBatchLane:
      type: object
      required: [lane, requests, issues]
      properties:
        lane: { type: string }
        requests:
          type: array
          items:
            type: object
            required: [id, prs]
            properties:
              id: { type: string }
              prs: { type: array, items: { type: integer } }
        issues: { type: array, items: { type: integer } }
    OrganizerBatch:
      type: object
      required: [seq, step, lanes, presentations, choices]
      properties:
        seq: { type: integer }
        step: { type: string, enum: [present, represent, "confirm:1", "confirm:2", continue] }
        lanes: { type: array, items: { $ref: "#/components/schemas/OrganizerBatchLane" } }
        presentations: { type: array, items: { type: object } }
        choices: { type: array, items: { type: string, enum: [continue, reject] } }
