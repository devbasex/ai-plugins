openapi: "3.1.0"
info:
  title: Neural Development Factory の委任の資格情報の API
  version: "0.1.0"
  description: >-
    人が画面で委任の資格情報を発行し、一覧で見て、取り消す操作（#2384）。委任は利用者に属し、アカウントに属さない。発行と取り消しは人だけが確定でき、委任の資格情報からは呼べない。一覧は委任の資格情報でも読める。
  contact: { name: devbasex/ai-plugins, url: "https://github.com/devbasex/ai-plugins" }
  license: { name: MIT, url: "https://github.com/devbasex/ai-plugins/blob/main/factory/LICENSE" }
servers: [{ url: "https://api.example.com", description: API の入口（値はインフラが FACTORY_API_URL で渡す） }]
tags: [{ name: delegations, description: エージェントへの委任 }]
security: [{ cognito: [] }, { delegation: [] }]
paths:
  /delegations:
    get:
      tags: [delegations]
      operationId: listDelegations
      summary: 自分が発行した委任の資格情報の一覧
      description: 新しい順に 100 件まで。値と秘密のハッシュは返さない。
      x-ndf-access: read
      responses:
        "200":
          description: 条件で集めた値の配列
          content: { "application/json": { schema: { type: array, items: { $ref: "#/components/schemas/Delegation" } } } }
        "401": { $ref: "#/components/responses/E401" }
        "503": { $ref: "#/components/responses/E503" }
    post:
      tags: [delegations]
      operationId: createDelegation
      summary: 委任の資格情報を発行する
      description: >-
        値（ndfd_<資格情報の ID>_<秘密>）は発行の結果で 1 度だけ返し、平文を保存しない。同じ冪等の鍵の 2 回目は同じ資格情報を返し、credential を null にする。期限は 300〜3,600 秒。
      x-ndf-access: human
      x-ndf-keys: [idempotency_key]
      x-ndf-id: delegation.credential_id
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/CreateDelegationItem" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/DelegationIssued" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
    delete:
      tags: [delegations]
      operationId: revokeDelegation
      summary: 委任の資格情報を取り消す
      description: 取り消しはその後の最初の要求から効く。期限切れと取り消し済みの資格情報は何も変えずに成功を返す。他人の資格情報は forbidden の結果になる。
      x-ndf-access: human
      x-ndf-keys: [credential_id]
      parameters:
        - name: credential_id
          in: query
          required: true
          style: form
          explode: true
          description: 要素の鍵。繰り返して 1〜100 個を指す
          schema: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/Delegation" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
components:
  securitySchemes:
    cognito: { type: http, scheme: bearer, description: Cognito の access token }
    delegation:
      type: http
      scheme: bearer
      description: 人が画面で発行した委任の資格情報（ndfd_<資格情報の ID>_<秘密>）。期限は 1 時間以内で、人だけが確定できる操作は呼べない
  responses:
    E400: { description: 要求全体の形が違う。どの要素も処理しない, content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } } }
    E401: { description: 資格情報が無い・無効・期限切れ・取り消し済み（unauthorized）, content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } } }
    E403: { description: 委任の資格情報で人だけの操作を呼んだ（human_only）, content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } } }
    E503: { description: 保存か操作の記録に失敗した。時間をおいてやり直す, content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string, description: 機械の値 }, message: { type: string, description: 利用者に出す文 }, details: { type: object } }
    ElementFailure:
      type: object
      description: 失敗した要素。認可の無い要素は forbidden だけを持ち、その要素のデータを含めない
      required: [ok, status, error]
      properties:
        ok: { const: false }
        status: { type: integer, enum: [400, 403, 404, 409, 422, 503] }
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: { type: object } }
    DelegationScope:
      type: string
      description: read（読み取りだけ）・read_write（読み書き）。どちらも人だけが確定できる操作は呼べない
      enum: [read, read_write]
    CreateDelegationItem:
      type: object
      required: [client_name, scope, expires_in_seconds, idempotency_key]
      additionalProperties: false
      properties:
        client_name: { type: string, minLength: 1, maxLength: 64, description: 人が付けるクライアントの名前。操作の記録には写さない }
        scope: { $ref: "#/components/schemas/DelegationScope" }
        expires_in_seconds: { type: integer, minimum: 300, maximum: 3600 }
        idempotency_key: { type: string, pattern: "^[0-9A-Za-z-]{1,64}$", description: 作成の冪等の鍵 }
    Delegation:
      type: object
      required: [credential_id, client_name, scope, created_at, expires_at, revoked_at, state]
      properties:
        credential_id: { type: string }
        client_name: { type: string }
        scope: { $ref: "#/components/schemas/DelegationScope" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: ["string", "null"], format: date-time }
        state: { type: string, enum: [active, expired, revoked] }
    DelegationIssued:
      type: object
      required: [delegation, credential]
      properties:
        delegation: { $ref: "#/components/schemas/Delegation" }
        credential: { type: ["string", "null"], description: 委任の資格情報の値。発行の結果で 1 度だけ返す。同じ冪等の鍵の 2 回目は null }
