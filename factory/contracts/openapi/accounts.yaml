openapi: "3.1.0"
info:
  title: Neural Development Factory のアカウントの API
  version: "0.1.0"
  description: >-
    画面向けのアカウント・席・実行の形態の操作（#2170）。利用者向けの操作は機能（エンティティと操作）から起こし、取得・作成・更新・削除とも配列で受け渡す（#2384）。Cognito の access token か、人が発行した委任の資格情報を Authorization: Bearer で要る。要素ごとの結果は入力と同じ順に返し、要求全体を断るのは資格情報・操作の扱い・要素の数と重複・経路のアカウント・操作の記録の失敗だけ。使える量の判定は HTTP の経路にせず、factory/api/src/index.ts の関数で呼ぶ。
  contact: { name: devbasex/ai-plugins, url: "https://github.com/devbasex/ai-plugins" }
  license: { name: MIT, url: "https://github.com/devbasex/ai-plugins/blob/main/factory/LICENSE" }
servers: [{ url: "https://api.example.com", description: API の入口（値はインフラが FACTORY_API_URL で渡す） }]
tags: [{ name: me, description: ログインした利用者 }, { name: accounts, description: アカウント・席・実行の形態 }]
security: [{ cognito: [] }, { delegation: [] }]
paths:
  "/me":
    get:
      tags: [me]
      operationId: getMe
      summary: 自分の利用者と、席を持つアカウントの一覧
      description: 初めての要求では、Free・local の個人のアカウントを 1 つ作る。
      x-ndf-access: read
      responses:
        "200":
          description: 条件で集めた値の配列
          content: { "application/json": { schema: { type: array, items: { $ref: "#/components/schemas/Me" } } } }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/teams":
    post:
      tags: [accounts]
      operationId: createTeam
      summary: チームのアカウントを作る
      description: 作った利用者がチームの持ち主になり、持ち主の席が 1 つできる。
      x-ndf-access: human
      x-ndf-keys: [idempotency_key]
      x-ndf-id: account_id
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/CreateTeamItem" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/AccountDetail" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/accounts":
    get:
      tags: [accounts]
      operationId: getAccount
      summary: アカウントの料金プラン・実行の形態・使える量・席
      description: 個人のアカウントの持ち主か、チームの席を持つ利用者だけが読める。
      x-ndf-access: read
      x-ndf-keys: [account_id]
      parameters:
        - name: account_id
          in: query
          required: true
          style: form
          explode: true
          description: "要素の鍵。繰り返して 1〜100 個を指す"
          schema: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/AccountDetail" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
    patch:
      tags: [accounts]
      operationId: setExecutionMode
      summary: 実行の形態を変える
      description: アカウントの持ち主だけが変えられる。今と同じ値なら履歴を足さずに 200 を返す。
      x-ndf-access: write
      x-ndf-keys: [account_id]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items: { $ref: "#/components/schemas/SetExecutionModeItem" }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/AccountDetail" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/accounts/{accountId}/seats":
    post:
      tags: [accounts]
      operationId: addSeat
      summary: 席を足す
      description: チームの持ち主が、既に 1 度ログインした利用者を ID で指して席を足す。
      x-ndf-access: human
      x-ndf-keys: [user_id]
      parameters: [{ name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }]
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/AddSeat" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/Seat" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
    patch:
      tags: [accounts]
      operationId: changeSeat
      summary: 席の種類を変える
      description: チームの持ち主だけが変えられる。
      x-ndf-access: human
      x-ndf-keys: [user_id]
      parameters: [{ name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }]
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/ChangeSeatItem" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/Seat" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
    delete:
      tags: [accounts]
      operationId: removeSeat
      summary: 席を外す
      description: チームの持ち主だけが外せる。持ち主自身の席は外せない。
      x-ndf-access: human
      x-ndf-keys: [user_id]
      parameters:
        - { name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }
        - name: user_id
          in: query
          required: true
          style: form
          explode: true
          description: "要素の鍵。繰り返して 1〜100 個を指す"
          schema: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/Removed" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
components:
  securitySchemes:
    cognito: { type: http, scheme: bearer, bearerFormat: JWT, description: Cognito の利用者プールの access token }
    delegation:
      type: http
      scheme: bearer
      description: >-
        人が画面で発行した委任の資格情報（ndfd_<資格情報の ID>_<秘密>）。期限は 1 時間以内で、人だけが確定できる操作は呼べない
  responses:
    E400:
      description: >-
        要求全体の形が違う（invalid_request・empty_items・too_many_items・duplicate_key）。どの要素も処理しない
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E401:
      description: 資格情報が無い・無効・期限切れ・取り消し済み（unauthorized）
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E403:
      description: >-
        経路のアカウントを解決できない（forbidden）・委任で人だけの操作を呼んだ（human_only）・読み取りだけの範囲で書き込んだ（scope_insufficient）
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E503:
      description: 保存か操作の記録に失敗した。時間をおいてやり直す
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Plan: { type: string, enum: [free, pro, max, team] }
    SeatType: { type: string, enum: [standard, premium] }
    ExecutionMode:
      type: string
      description: local（手元のマシン）・byok（キーの持ち込み）・managed（サービスの Bedrock）
      enum: [local, byok, managed]
    Idp: { type: string, enum: [google, github] }
    AccountSummary:
      type: object
      required: [account_id, kind, name, plan, role, seat_type, execution_mode]
      properties:
        account_id: { type: string }
        kind: { type: string, enum: [personal, team] }
        name: { type: [string, "null"], description: チームの名前。個人のアカウントは null }
        plan: { $ref: "#/components/schemas/Plan" }
        role: { type: string, enum: [owner, member] }
        seat_type:
          description: チームのときだけ、要求した利用者の席の種類
          oneOf: [{ $ref: "#/components/schemas/SeatType" }, { type: "null" }]
        execution_mode: { $ref: "#/components/schemas/ExecutionMode" }
    Limits:
      type: object
      required: [concurrent_sprint_runs, monthly_tokens]
      properties:
        concurrent_sprint_runs: { type: integer, description: 同時に動かせるスプリントの実行の数 }
        monthly_tokens: { type: [integer, "null"], description: 月の token の上限。実行の形態が managed のときだけ数で、ほかは null（掛けない） }
    Seat:
      type: object
      required: [user_id, idp, seat_type, added_at]
      properties:
        user_id: { type: string }
        idp: { oneOf: [{ $ref: "#/components/schemas/Idp" }, { type: "null" }] }
        seat_type: { $ref: "#/components/schemas/SeatType" }
        added_at: { type: string, format: date-time }
    AccountDetail:
      allOf:
        - { $ref: "#/components/schemas/AccountSummary" }
        - type: object
          required: [limits, seats]
          properties:
            limits: { description: 表に無い組では null, oneOf: [{ $ref: "#/components/schemas/Limits" }, { type: "null" }] }
            seats:
              description: チームだけ。個人のアカウントは null
              oneOf: [{ type: array, items: { $ref: "#/components/schemas/Seat" } }, { type: "null" }]
    Me:
      type: object
      required: [user_id, idp, personal_account_id, accounts]
      properties:
        user_id: { type: string }
        idp: { $ref: "#/components/schemas/Idp" }
        personal_account_id: { type: string }
        accounts: { type: array, items: { $ref: "#/components/schemas/AccountSummary" } }
    AddSeat:
      type: object
      required: [user_id, seat_type]
      properties:
        user_id: { type: string, minLength: 1, maxLength: 128 }
        seat_type: { $ref: "#/components/schemas/SeatType" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 機械の値 }
            message: { type: string, description: 利用者に出す文 }
            details: { type: object }
    ElementFailure:
      type: object
      description: 失敗した要素。認可の無い要素は forbidden だけを持ち、その要素のデータを含めない
      required: [ok, status, error]
      properties:
        ok: { const: false }
        status: { type: integer, enum: [400, 403, 404, 409, 422, 503] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 機械の値 }
            message: { type: string, description: 利用者に出す文 }
            details: { type: object }
    CreateTeamItem:
      type: object
      required: [idempotency_key, name, seat_type]
      properties:
        idempotency_key:
          type: string
          pattern: "^[0-9A-Za-z-]{1,64}$"
          description: 作成の冪等の鍵。同じ利用者・同じ操作・同じ鍵の作成は 24 時間の間 1 件にする
        name: { type: string, minLength: 1, maxLength: 64 }
        seat_type: { $ref: "#/components/schemas/SeatType" }
    SetExecutionModeItem:
      type: object
      required: [account_id, execution_mode]
      properties:
        account_id: { type: string, minLength: 1 }
        execution_mode: { $ref: "#/components/schemas/ExecutionMode" }
    ChangeSeatItem:
      type: object
      required: [user_id, seat_type]
      properties:
        user_id: { type: string, minLength: 1, maxLength: 128 }
        seat_type: { $ref: "#/components/schemas/SeatType" }
    Removed: { type: object, required: [removed], properties: { removed: { const: true } } }
