openapi: "3.1.0"
info:
  title: Neural Development Factory のオーガナイザーの API
  version: "0.1.0"
  description: >-
    Factory のオーガナイザーの操作（#2439）。利用者向けの操作は機能（エンティティと操作）から起こし、取得・作成・更新・削除とも配列で受け渡す（#2384）。Cognito の access token か、人が発行した委任の資格情報を Authorization: Bearer で要る。要素ごとの結果は入力と同じ順に返し、要求全体を断るのは資格情報・操作の扱い・要素の数と重複・経路のアカウント・操作の記録の失敗だけ。止まった配布を解く操作は人だけが確定できる（オーガナイザーの I66）。
  contact: { name: devbasex/ai-plugins, url: "https://github.com/devbasex/ai-plugins" }
  license: { name: MIT, url: "https://github.com/devbasex/ai-plugins/blob/main/factory/LICENSE" }
servers: [{ url: "https://api.example.com", description: API の入口（値はインフラが FACTORY_API_URL で渡す） }]
tags: [{ name: organizer, description: Factory のオーガナイザー }]
security: [{ cognito: [] }, { delegation: [] }]
paths:
  "/accounts/{accountId}/approval-requests":
    get:
      tags: [organizer]
      operationId: listRepositoryApprovalRequests
      summary: リポジトリの承認と問いの一覧
      description: >-
        同じリポジトリの承認待ちの実行の承認の依頼（ゲート 1・ゲート 2・判断）、止まった配布、開発ループの人の判断待ちを、 作った時刻の古い順に 1 つの並びで返す。承認の依頼の中身（承認資料・答え）は承認の依頼の経路が持ち、ここは識別子と要約だけを返す。
      x-ndf-access: read
      x-ndf-keys: [repository_id]
      parameters:
        - { name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }
        - name: repository_id
          in: query
          required: true
          style: form
          explode: true
          description: "要素の鍵。繰り返して 1〜100 個を指す"
          schema: { type: array, minItems: 1, maxItems: 100, items: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/ApprovalRequestList" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/accounts/{accountId}/releases":
    get:
      tags: [organizer]
      operationId: listRepositoryReleases
      summary: まとめた配布の履歴
      description: >-
        新しい順に limit 件（既定 20、最大 100）。提示・確定・結果と、待ち・組む・出し直し・確定・結果の記録を返す。
      x-ndf-access: read
      parameters:
        - { name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }
        - { name: repository_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: 条件で集めた値の配列
          content:
            "application/json": { schema: { type: array, items: { $ref: "#/components/schemas/ReleaseBatch" } } }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/accounts/{accountId}/releases/resolve":
    post:
      tags: [organizer]
      operationId: resolveStalledRelease
      summary: 止まった配布を解く
      description: >-
        配布の実行が失敗して止まったまとめた配布を「続きから流す」（continue）か「差し戻す」（reject）で解く。 止まっていなければ 409 not_stalled、main へのマージの後の差し戻しは 409 release_after_main（I63）。
      x-ndf-access: human
      x-ndf-keys: [repository_id, seq]
      parameters: [{ name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }]
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/ResolveItem" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/ResolveResult" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
components:
  securitySchemes:
    cognito: { type: http, scheme: bearer, description: Cognito の access token }
    delegation:
      type: http
      scheme: bearer
      description: >-
        人が画面で発行した委任の資格情報（ndfd_<資格情報の ID>_<秘密>）。期限は 1 時間以内で、人だけが確定できる操作は呼べない
  responses:
    E400:
      description: >-
        要求全体の形が違う（invalid_request・empty_items・too_many_items・duplicate_key）。どの要素も処理しない
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E403:
      description: >-
        経路のアカウントを解決できない（forbidden）・委任で人だけの操作を呼んだ（human_only）・読み取りだけの範囲で書き込んだ（scope_insufficient）
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E401:
      description: 資格情報が無い・無効・期限切れ・取り消し済み（unauthorized）
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E503:
      description: 保存か操作の記録に失敗した。時間をおいてやり直す
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 機械の値 }
            message: { type: string, description: 利用者に出す文 }
            details: { type: object }
    OrganizerSummary:
      type: object
      required: [current_seq, wait_reason, wait_detail]
      properties:
        current_seq: { type: [integer, "null"], description: 流れているまとめた配布の連番。null は流れていない }
        wait_reason: { type: [string, "null"], enum: [external_release_open, legacy_run, null] }
        wait_detail: { type: [string, "null"], description: 待ちの相手（外の Pull Request の URL・古い版の実行の数） }
    ReleaseLane:
      type: object
      required: [lane, requested, prs]
      properties:
        lane: { type: string }
        requested: { type: boolean }
        prs: { type: array, items: { type: integer } }
    ReleaseSummary:
      type: object
      required: [seq, k, sha, lanes, added_prs, choices]
      properties:
        seq: { type: integer }
        k: { type: [integer, "null"], description: 最後の提示の番号。提示の前に止まった配布は null }
        sha: { type: [string, "null"] }
        lanes: { type: array, items: { $ref: "#/components/schemas/ReleaseLane" } }
        added_prs: { type: array, items: { type: integer } }
        choices: { type: array, items: { type: string, enum: [continue, reject] } }
    ApprovalRequestItem:
      type: object
      required: [kind, created_at]
      properties:
        kind: { type: string, enum: [gate1, gate2, decision, loop_pending, release_stalled] }
        sprint_run_id: { type: string }
        loop_id: { type: string }
        approval_request_id: { type: string }
        pr_url: { type: [string, "null"] }
        number: { type: integer, description: ループの人の判断待ちの課題の番号 }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        release: { $ref: "#/components/schemas/ReleaseSummary" }
    ApprovalRequestList:
      type: object
      required: [repository_id, organizer, items]
      properties:
        repository_id: { type: integer }
        organizer: { $ref: "#/components/schemas/OrganizerSummary" }
        items: { type: array, items: { $ref: "#/components/schemas/ApprovalRequestItem" } }
    Presentation:
      type: object
      required: [k, sha, version, prs, lanes, added_prs, at]
      properties:
        k: { type: integer }
        sha: { type: string }
        version: { type: string }
        prs: { type: array, items: { type: integer } }
        lanes:
          type: array
          items:
            type: object
            required: [lane, requested]
            properties: { lane: { type: string }, requested: { type: boolean } }
        added_prs: { type: array, items: { type: integer } }
        at: { type: string, format: date-time }
    ReleaseResult:
      type: object
      required: [version, prod_pr_url, sha, prs]
      properties:
        version: { type: [string, "null"] }
        prod_pr_url: { type: [string, "null"] }
        sha: { type: [string, "null"] }
        prs: { type: array, items: { type: integer } }
    ReleaseLogEntry:
      type: object
      required: [at, kind, detail]
      properties:
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [waited, composed, presented, represented, confirmed, stalled, resolved, released, rejected]
        detail: { type: object }
    ReleaseBatch:
      type: object
      required: [seq, state, release_run_id, presentations, confirmed_k, result, log]
      properties:
        seq: { type: integer }
        state: { type: string, enum: [composed, presented, represented, confirmed, stalled, released, rejected] }
        release_run_id: { type: string }
        presentations: { type: array, items: { $ref: "#/components/schemas/Presentation" } }
        confirmed_k: { type: [integer, "null"] }
        result: { oneOf: [{ $ref: "#/components/schemas/ReleaseResult" }, { type: "null" }] }
        log: { type: array, items: { $ref: "#/components/schemas/ReleaseLogEntry" } }
    ResolveResult:
      type: object
      required: [seq, state]
      properties:
        seq: { type: integer }
        state: { type: string, enum: [composed, represented, confirmed, rejected] }
    ElementFailure:
      type: object
      description: 失敗した要素。認可の無い要素は forbidden だけを持ち、その要素のデータを含めない
      required: [ok, status, error]
      properties:
        ok: { const: false }
        status: { type: integer, enum: [400, 403, 404, 409, 422, 503] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 機械の値 }
            message: { type: string, description: 利用者に出す文 }
            details: { type: object }
    ResolveItem:
      type: object
      required: [repository_id, seq, choice]
      properties:
        repository_id: { type: integer, minimum: 1 }
        seq: { type: integer, minimum: 1 }
        choice: { type: string, enum: [continue, reject] }
        body: { type: string, maxLength: 4000 }
