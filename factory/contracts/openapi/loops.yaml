openapi: "3.1.0"
info:
  title: Neural Development Factory の開発ループの API
  version: "0.1.0"
  description: >-
    リポジトリの登録ごとに開発ループを始め・止め・予算を変え、周回と人の判断待ちを見る操作（#2347）。利用者向けの操作は機能（エンティティと操作）から起こし、取得・作成・更新・削除とも配列で受け渡す（#2384）。Cognito の access token か、人が発行した委任の資格情報を Authorization: Bearer で要る。要素ごとの結果は入力と同じ順に返し、要求全体を断るのは資格情報・操作の扱い・要素の数と重複・経路のアカウント・操作の記録の失敗だけ。ループの accountId が一致しない要素は forbidden、無い要素は loop_not_found（404）の結果になる。人の判断待ちへの答えは人だけが確定できる。
  contact: { name: devbasex/ai-plugins, url: "https://github.com/devbasex/ai-plugins" }
  license: { name: MIT, url: "https://github.com/devbasex/ai-plugins/blob/main/factory/LICENSE" }
servers: [{ url: "https://api.example.com", description: API の入口（値はインフラが FACTORY_API_URL で渡す） }]
tags: [{ name: loops, description: 開発ループ }]
security: [{ cognito: [] }, { delegation: [] }]
paths:
  "/accounts/{accountId}/loops":
    post:
      tags: [loops]
      operationId: startLoop
      summary: 開発ループを始める
      description: >-
        マイルストーンの持ち分とループの行を 1 回のトランザクションで書き、続けて最初の周回を起こす。 枠で待つときも成功の結果（between_laps）。マイルストーンが同じリポジトリの終わりの状態でないループと重なると 409 milestone_in_use（details.milestones・details.loop_name）、名前が重なると 409 loop_name_in_use。
      x-ndf-access: write
      x-ndf-keys: [idempotency_key]
      x-ndf-id: loop_id
      parameters: [{ name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }]
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/LoopStartItem" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/LoopStarted" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
    get:
      tags: [loops]
      operationId: listLoops
      summary: リポジトリの開発ループの一覧
      description: 新しい順に 50 件。
      x-ndf-access: read
      parameters:
        - { name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }
        - { name: repository_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: 条件で集めた値の配列
          content: { "application/json": { schema: { type: array, items: { $ref: "#/components/schemas/LoopRow" } } } }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
    patch:
      tags: [loops]
      operationId: updateLoopBudget
      summary: 開発ループの予算を変える
      description: 終わりの状態でないループにだけ効き、次のジョブの指示から NDF の予算へ渡る。
      x-ndf-access: write
      x-ndf-keys: [loop_id]
      parameters: [{ name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }]
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/LoopBudgetItem" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/LoopRow" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/accounts/{accountId}/loops/detail":
    get:
      tags: [loops]
      operationId: getLoop
      summary: 開発ループの詳細
      description: 締めた周回・周回ごとの実行と区間の数・人の判断待ちと答え。
      x-ndf-access: read
      x-ndf-keys: [loop_id]
      parameters:
        - { name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }
        - name: loop_id
          in: query
          required: true
          style: form
          explode: true
          description: "要素の鍵。繰り返して 1〜100 個を指す"
          schema: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/LoopDetail" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/accounts/{accountId}/loops/cancel":
    post:
      tags: [loops]
      operationId: cancelLoop
      summary: 開発ループを止める
      description: 動いている実行があればスプリントの実行の取り消しと同じ形で止め、停止の後に cancelled へ移す。
      x-ndf-access: write
      x-ndf-keys: [loop_id]
      parameters: [{ name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }]
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/LoopRef" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/LoopStateResult" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/accounts/{accountId}/loops/next-lap":
    post:
      tags: [loops]
      operationId: startNextLap
      summary: 次の周回を始める（形態 local）
      description: >-
        次の周回を始める操作を待っている（wait_reason が user_start の）ループだけ。ほかは 409 not_awaiting_user_start。
      x-ndf-access: write
      x-ndf-keys: [loop_id]
      parameters: [{ name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }]
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/LoopRef" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/LoopStateResult" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
  "/accounts/{accountId}/loops/answers":
    post:
      tags: [loops]
      operationId: answerLoopPending
      summary: 人の判断待ちの課題に答える
      description: >-
        答えは次のジョブの LOOP_ANSWERS に載り、ランナーが NDF の loop answer で書く。人の判断待ちに無い番号は 409 not_pending。
      x-ndf-access: human
      x-ndf-keys: [loop_id, issue]
      parameters: [{ name: accountId, in: path, required: true, description: アカウントの ID, schema: { type: string } }]
      requestBody:
        required: true
        content:
          "application/json":
            schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/LoopAnswerItem" } }
      responses:
        "200":
          description: 入力と同じ順・同じ数の要素の結果
          content:
            "application/json":
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      required: [ok, value]
                      properties: { ok: { const: true }, value: { $ref: "#/components/schemas/LoopPendingResult" } }
                    - { $ref: "#/components/schemas/ElementFailure" }
        "400": { $ref: "#/components/responses/E400" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "503": { $ref: "#/components/responses/E503" }
components:
  securitySchemes:
    cognito: { type: http, scheme: bearer, description: Cognito の access token }
    delegation:
      type: http
      scheme: bearer
      description: >-
        人が画面で発行した委任の資格情報（ndfd_<資格情報の ID>_<秘密>）。期限は 1 時間以内で、人だけが確定できる操作は呼べない
  responses:
    E400:
      description: >-
        要求全体の形が違う（invalid_request・empty_items・too_many_items・duplicate_key）。どの要素も処理しない
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E403:
      description: >-
        経路のアカウントを解決できない（forbidden）・委任で人だけの操作を呼んだ（human_only）・読み取りだけの範囲で書き込んだ（scope_insufficient）
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E401:
      description: 資格情報が無い・無効・期限切れ・取り消し済み（unauthorized）
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
    E503:
      description: 保存か操作の記録に失敗した。時間をおいてやり直す
      content: { "application/json": { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 機械の値 }
            message: { type: string, description: 利用者に出す文 }
            details: { type: object }
    LoopName: { type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z_-]{0,63}$" }
    Budget:
      type: object
      additionalProperties: false
      properties:
        laps: { type: [number, "null"], exclusiveMinimum: 0 }
        usd: { type: [number, "null"], exclusiveMinimum: 0 }
        hours: { type: [number, "null"], exclusiveMinimum: 0 }
    LoopState: { type: string, enum: [running, between_laps, awaiting_approval, stopped, cancelled] }
    LoopStarted:
      type: object
      required: [loop_id, state]
      properties: { loop_id: { type: string }, state: { type: string, enum: [running, between_laps, stopped] } }
    LoopRow:
      type: object
      required:
        - loop_id
        - name
        - milestones
        - state
        - wait_reason
        - laps_closed
        - cost_usd
        - budget
        - budget_remaining
        - last_run_at
        - stop_condition
        - stop_detail
      properties:
        loop_id: { type: string }
        name: { $ref: "#/components/schemas/LoopName" }
        milestones: { type: array, items: { type: string } }
        state: { $ref: "#/components/schemas/LoopState" }
        wait_reason: { type: [string, "null"], enum: [slots, legacy_version, user_start, null] }
        laps_closed: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
        budget: { $ref: "#/components/schemas/Budget" }
        budget_remaining: { $ref: "#/components/schemas/Budget" }
        last_run_at: { type: [string, "null"], format: date-time }
        stop_condition: { type: [string, "null"] }
        stop_detail: { type: [string, "null"] }
    LoopPending:
      type: object
      required: [number, reason, lap, answer]
      properties:
        number: { type: integer, minimum: 1 }
        reason: { type: string }
        lap: { type: integer, minimum: 1 }
        answer:
          type: [object, "null"]
          required: [decision, pr]
          properties:
            decision: { type: string, enum: [approved, rejected] }
            pr: { type: [integer, "null"], minimum: 1 }
    LoopDetail:
      type: object
      required: [loop, laps, runs, pending]
      properties:
        loop: { $ref: "#/components/schemas/LoopRow" }
        laps:
          type: array
          items:
            type: object
            required: [lap, issues, result, version, cost_usd, seconds]
            properties:
              lap: { type: integer, minimum: 1 }
              issues: { type: array, items: { type: integer } }
              result: { type: string, enum: [完了, 失敗, 人へ戻した] }
              version: { type: [string, "null"] }
              cost_usd: { type: number, minimum: 0 }
              seconds: { type: number, minimum: 0 }
        runs:
          type: array
          items:
            type: object
            required: [sprint_run_id, lap, state, failure_reason, finish_reason, resume_at, cost_usd, sections]
            properties:
              sprint_run_id: { type: string }
              lap: { type: integer, minimum: 1 }
              state:
                type: string
                enum: [starting, running, awaiting_approval, awaiting_reset, done, stopped, failed, cancelled]
              failure_reason: { type: [string, "null"] }
              finish_reason: { type: [string, "null"], enum: [section_limit, usage_limit, null] }
              resume_at: { type: [string, "null"], format: date-time }
              cost_usd: { type: number, minimum: 0 }
              sections: { type: integer, minimum: 0 }
        pending: { type: array, items: { $ref: "#/components/schemas/LoopPending" } }
    LoopStateResult:
      type: object
      required: [state]
      properties: { state: { $ref: "#/components/schemas/LoopState" } }
    ElementFailure:
      type: object
      description: 失敗した要素。認可の無い要素は forbidden だけを持ち、その要素のデータを含めない
      required: [ok, status, error]
      properties:
        ok: { const: false }
        status: { type: integer, enum: [400, 403, 404, 409, 422, 503] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 機械の値 }
            message: { type: string, description: 利用者に出す文 }
            details: { type: object }
    LoopStartItem:
      type: object
      required: [repository_id, idempotency_key, name, milestones]
      additionalProperties: false
      properties:
        repository_id: { type: integer, minimum: 1 }
        idempotency_key:
          type: string
          pattern: "^[0-9A-Za-z-]{1,64}$"
          description: 作成の冪等の鍵。同じ利用者・同じ操作・同じ鍵の作成は 24 時間の間 1 件にする
        name: { $ref: "#/components/schemas/LoopName" }
        milestones:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100, pattern: "^[^,]+$" }
        budget: { $ref: "#/components/schemas/Budget" }
    LoopBudgetItem:
      type: object
      required: [loop_id, budget]
      additionalProperties: false
      properties: { loop_id: { type: string, minLength: 1 }, budget: { $ref: "#/components/schemas/Budget" } }
    LoopRef:
      type: object
      required: [loop_id]
      additionalProperties: false
      properties: { loop_id: { type: string, minLength: 1 } }
    LoopAnswerItem:
      type: object
      required: [loop_id, issue, decision]
      additionalProperties: false
      properties:
        loop_id: { type: string, minLength: 1 }
        issue: { type: integer, minimum: 1 }
        decision: { type: string, enum: [approved, rejected] }
        pr: { type: integer, minimum: 1 }
    LoopPendingResult:
      type: object
      required: [loop_id, pending]
      properties:
        loop_id: { type: string }
        pending: { type: array, items: { $ref: "#/components/schemas/LoopPending" } }
