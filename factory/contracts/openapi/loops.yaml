openapi: 3.1.0
info:
  title: Neural Development Factory の開発ループの API
  version: 0.1.0
  description: >-
    リポジトリの登録ごとに開発ループを始め・止め・予算を変え、周回と人の判断待ちを見る画面向けの経路（#2347）。
    どの経路も Cognito の access token を Authorization: Bearer で要る。ループの accountId が一致しなければ 403、無ければ 404 loop_not_found。
  contact:
    name: devbasex/ai-plugins
    url: https://github.com/devbasex/ai-plugins
  license:
    name: MIT
    url: https://github.com/devbasex/ai-plugins/blob/main/factory/LICENSE
servers:
  - url: https://api.example.com
    description: API の入口（値はインフラが FACTORY_API_URL で渡す）
tags:
  - name: loops
    description: 開発ループ
security:
  - cognito: []
paths:
  /accounts/{accountId}/repositories/{repositoryId}/loops:
    post:
      tags: [loops]
      operationId: startLoop
      summary: 開発ループを始める
      description: >-
        マイルストーンの持ち分とループの行を 1 回のトランザクションで書き、続けて最初の周回を起こす。
        枠で待つときも 201（between_laps）。マイルストーンが同じリポジトリの終わりの状態でないループと重なると
        409 milestone_in_use（details.milestones・details.loop_name）、名前が重なると 409 loop_name_in_use。
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/RepositoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoopStartRequest"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopStarted"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
    get:
      tags: [loops]
      operationId: listLoops
      summary: リポジトリの開発ループの一覧
      description: 新しい順に 50 件。
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/RepositoryId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopList"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
  /accounts/{accountId}/loops/{loopId}:
    get:
      tags: [loops]
      operationId: getLoop
      summary: 開発ループの詳細
      description: 締めた周回・周回ごとの実行と区間の数・人の判断待ちと答え。
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/LoopId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopDetail"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
    patch:
      tags: [loops]
      operationId: updateLoopBudget
      summary: 開発ループの予算を変える
      description: 終わりの状態でないループにだけ効き、次のジョブの指示から NDF の予算へ渡る。
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/LoopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoopBudgetUpdate"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopRow"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
  /accounts/{accountId}/loops/{loopId}/cancel:
    post:
      tags: [loops]
      operationId: cancelLoop
      summary: 開発ループを止める
      description: 動いている実行があればスプリントの実行の取り消しと同じ形で止め、停止の後に cancelled へ移す。
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/LoopId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopStateResult"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
  /accounts/{accountId}/loops/{loopId}/next-lap:
    post:
      tags: [loops]
      operationId: startNextLap
      summary: 次の周回を始める（形態 local）
      description: 次の周回を始める操作を待っている（wait_reason が user_start の）ループだけ。ほかは 409 not_awaiting_user_start。
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/LoopId"
      responses:
        "202":
          description: 受け付けた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopStateResult"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
  /accounts/{accountId}/loops/{loopId}/answers:
    post:
      tags: [loops]
      operationId: answerLoopPending
      summary: 人の判断待ちの課題に答える
      description: 答えは次のジョブの LOOP_ANSWERS に載り、ランナーが NDF の loop answer で書く。人の判断待ちに無い番号は 409 not_pending。
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/LoopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoopAnswer"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoopPendingList"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      description: Cognito の access token
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema:
        type: string
    LoopId:
      name: loopId
      in: path
      required: true
      schema:
        type: string
  responses:
    E400:
      description: 要求の形が違う
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E403:
      description: 権限が無い（他人のアカウントと同じ本文）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E404:
      description: 見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E409:
      description: 状態が合わない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
    LoopName:
      type: string
      pattern: "^[0-9A-Za-z][0-9A-Za-z_-]{0,63}$"
    Budget:
      type: object
      additionalProperties: false
      properties:
        laps: { type: ["number", "null"], exclusiveMinimum: 0 }
        usd: { type: ["number", "null"], exclusiveMinimum: 0 }
        hours: { type: ["number", "null"], exclusiveMinimum: 0 }
    LoopState:
      type: string
      enum: [running, between_laps, awaiting_approval, stopped, cancelled]
    LoopStartRequest:
      type: object
      required: [name, milestones]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/LoopName" }
        milestones:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100, pattern: "^[^,]+$" }
        budget: { $ref: "#/components/schemas/Budget" }
    LoopStarted:
      type: object
      required: [loop_id, state]
      properties:
        loop_id: { type: string }
        state: { type: string, enum: [running, between_laps, stopped] }
    LoopRow:
      type: object
      required:
        [loop_id, name, milestones, state, wait_reason, laps_closed, cost_usd, budget, budget_remaining, last_run_at, stop_condition, stop_detail]
      properties:
        loop_id: { type: string }
        name: { $ref: "#/components/schemas/LoopName" }
        milestones: { type: array, items: { type: string } }
        state: { $ref: "#/components/schemas/LoopState" }
        wait_reason: { type: ["string", "null"], enum: [slots, legacy_version, user_start, null] }
        laps_closed: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
        budget: { $ref: "#/components/schemas/Budget" }
        budget_remaining: { $ref: "#/components/schemas/Budget" }
        last_run_at: { type: ["string", "null"], format: date-time }
        stop_condition: { type: ["string", "null"] }
        stop_detail: { type: ["string", "null"] }
    LoopList:
      type: object
      required: [loops]
      properties:
        loops:
          type: array
          items: { $ref: "#/components/schemas/LoopRow" }
    LoopPending:
      type: object
      required: [number, reason, lap, answer]
      properties:
        number: { type: integer, minimum: 1 }
        reason: { type: string }
        lap: { type: integer, minimum: 1 }
        answer:
          type: ["object", "null"]
          required: [decision, pr]
          properties:
            decision: { type: string, enum: [approved, rejected] }
            pr: { type: ["integer", "null"], minimum: 1 }
    LoopDetail:
      type: object
      required: [loop, laps, runs, pending]
      properties:
        loop: { $ref: "#/components/schemas/LoopRow" }
        laps:
          type: array
          items:
            type: object
            required: [lap, issues, result, version, cost_usd, seconds]
            properties:
              lap: { type: integer, minimum: 1 }
              issues: { type: array, items: { type: integer } }
              result: { type: string, enum: ["完了", "失敗", "人へ戻した"] }
              version: { type: ["string", "null"] }
              cost_usd: { type: number, minimum: 0 }
              seconds: { type: number, minimum: 0 }
        runs:
          type: array
          items:
            type: object
            required: [sprint_run_id, lap, state, failure_reason, finish_reason, resume_at, cost_usd, sections]
            properties:
              sprint_run_id: { type: string }
              lap: { type: integer, minimum: 1 }
              state: { type: string, enum: [starting, running, awaiting_approval, awaiting_reset, done, stopped, failed, cancelled] }
              failure_reason: { type: ["string", "null"] }
              finish_reason: { type: ["string", "null"], enum: [section_limit, usage_limit, null] }
              resume_at: { type: ["string", "null"], format: date-time }
              cost_usd: { type: number, minimum: 0 }
              sections: { type: integer, minimum: 0 }
        pending:
          type: array
          items: { $ref: "#/components/schemas/LoopPending" }
    LoopBudgetUpdate:
      type: object
      required: [budget]
      additionalProperties: false
      properties:
        budget: { $ref: "#/components/schemas/Budget" }
    LoopStateResult:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/LoopState" }
    LoopAnswer:
      type: object
      required: [issue, decision]
      additionalProperties: false
      properties:
        issue: { type: integer, minimum: 1 }
        decision: { type: string, enum: [approved, rejected] }
        pr: { type: integer, minimum: 1 }
    LoopPendingList:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { $ref: "#/components/schemas/LoopPending" }
