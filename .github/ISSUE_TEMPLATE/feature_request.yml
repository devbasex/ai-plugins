name: 機能の要望
description: 足りない機能、既存の手順の改善
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欄の名前と書く水準は、記載項目の定義
        [plugins/ndf/scripts/data/issue-items.json](https://github.com/devbasex/ai-plugins/blob/main/plugins/ndf/scripts/data/issue-items.json)
        にあります。

  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 今どうなっているか・誰に効くか・変えると何が成り立つかを書いてください。機能の形ではなく、状況から書くと検討しやすくなります。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 対象範囲
      description: 含むものと含まないものを、1 行ずつ以上書いてください。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: どうなると解決したと言えるかを、1 行 1 条件の観測できる結果で書いてください。案で構いません。
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: "影響: ランタイム"
      multiple: true
      options:
        - Claude Code (claude)
        - Codex (codex)
        - Kiro CLI (kiro-cli)
        - agy (Antigravity CLI)
        - 4 つすべて
        - ランタイムに依らない
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: 直し方の案
      description: 案と、ほかに考えて採らない方法とその理由があれば書いてください。
