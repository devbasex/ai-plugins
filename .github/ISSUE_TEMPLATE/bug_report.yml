name: 不具合の報告
description: 書かれたとおりに実行して、書かれたとおりに動かない
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        脆弱性は公開の issue に書かないでください。報告の方法は
        [SECURITY.md](https://github.com/devbasex/ai-plugins/blob/main/SECURITY.md) にあります。

  - type: textarea
    id: summary
    attributes:
      label: 事象
      description: 何が起きたかを 1〜3 行で書いてください。
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: ランタイム
      description: 事象を確認した CLI を選んでください。複数で確認した場合は複数選べます。
      multiple: true
      options:
        - Claude Code (claude)
        - Codex (codex)
        - Kiro CLI (kiro-cli)
        - agy (Antigravity CLI)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NDF の版
      description: "`claude plugin list` / `codex plugin list` / `agy plugin list` で確認できます。"
      placeholder: "10.3.1"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Ubuntu 24.04 / macOS 15.2 / Windows 11 + WSL2"
    validations:
      required: true

  - type: input
    id: skill
    attributes:
      label: 関係する Skill 名
      description: 分かる範囲で構いません。フックが原因と思われる場合は「フック」と書いてください。
      placeholder: "cross-review"

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 実行したコマンドと、そのときのリポジトリの状態を書いてください。
      placeholder: |
        1. `/ndf:worktree feature/foo` を実行する
        2. 作業ツリーの中で `README.md` を編集する
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: エラーの出力があれば、そのまま貼ってください。
      render: console
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 原因の見当・影響・修正案
      description: 調べた範囲で分かっていることがあれば書いてください。空欄でも構いません。
