name: ndf-next release

# 作り直しの NDF（plugins/ndf-next/。#1142 の M2 #3296）のリリース。振る舞いはブランチ戦略（宣言 .ndf/worktree.json の
# branch_flow）の行で選ぶ（#3572 の決定 16）。github-flow の行ではスプリントの PR（main 宛て）が本番の PR を兼ね、main への
# マージがそのままリリースになり、版数とタグは main へのマージの後にこの workflow（CD）が版上げの PR で作る。ほかの行では
# リリースブランチの PR が版を上げ、bump は何もせず（not_applicable）、publish がそのマージコミットにタグを作る。
# 処理はすべて ndf-next のエントリポイント（plugins/ndf-next/bin/ndf release-steps）が持ち、plugins/ndf/scripts/ を呼ばない。
#
# 入れ替え（S2 #3304）までは、今の NDF の release-approval.yml・release-cd.yml・release-dev.yml が同じ出来事で動く。
# 同じ commit status とタグを取り合わないよう、出来事での起動はリポジトリの変数 NDF_RELEASE_RUNNER が ndf-next のときだけに
# する。手動の起動（workflow_dispatch）はいつでも打てる。S2 がこの条件と古い 3 本を消す。
#
# 起動の出来事と仕事:
# - PR の出来事の pr-check と verify-ref は ndf-next-pr.yml が持つ（宛先で絞らない workflow に分ける）
# - push（main）と workflow_dispatch（step=bump）: bump（github-flow の行で版上げの PR を作り・進め・置き換え、照合付きで
#   入れる。マージの方式 production_merge.method があれば迂回せずに方式で入れる。決定 20）
# - bump の後（state が published か not_applicable）と workflow_dispatch（step=publish、入力 revision）: publish（足りない
#   タグと GitHub Release。版の変わっていないコミットでは何も作らない）
# - workflow_dispatch（step=assemble、入力 pr）: 本番の PR の本文の承認資料の節を書く
# - workflow_dispatch（step=merge、入力 pr）と issue_comment（証跡の印を含むコメント）: 承認の証跡と必須のチェックの後に、
#   承認した head との照合付きでマージかキューへの投入をする。リリース記録は本番のプランが CD の確かめ（confirm）の後に書く
#
# 本番ブランチの名前は宣言 .ndf/worktree.json の production_branch から読む（ここに写さない。push の絞り込みの main を除く）。
# 版上げの PR と検証用ブランチで CI を起動するため、PR の作成・マージと push は利用者の token（secrets.NDF_RELEASE_TOKEN）で
# 行う（GITHUB_TOKEN の操作では CI が起動しない）。新しい秘密を足さない。
on:
  workflow_dispatch:
    inputs:
      step:
        description: assemble（承認資料）・merge（マージ）・bump（版上げ）・publish（タグと GitHub Release）
        required: true
        type: choice
        options: [assemble, merge, bump, publish]
      pr:
        description: assemble・merge する本番の PR の番号
        required: false
      revision:
        description: publish するコミット（版上げの PR のマージコミット。confirm の値の項目 bump_revision）
        required: false
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]

run-name: "ndf-next release (${{ github.event_name }}${{ inputs.step && format(' {0}', inputs.step) || '' }})"

permissions:
  contents: read

env:
  NDF: plugins/ndf-next/bin/ndf
  # 必須のチェックを待つ秒（マージの前）
  CHECK_BUDGET: "3600"

jobs:
  branches:
    # 宣言 .ndf/worktree.json の本番ブランチを 1 か所で読み、後のジョブへ渡す（既定ブランチのものを読む）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.NDF_RELEASE_RUNNER == 'ndf-next') ||
      (github.event_name == 'issue_comment' && vars.NDF_RELEASE_RUNNER == 'ndf-next' &&
       github.event.issue.pull_request &&
       (contains(github.event.comment.body, ':release-approval -->') ||
        contains(github.event.changes.body.from, ':release-approval -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      production: ${{ steps.read.outputs.production }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: read
        run: echo "production=$(jq -r '.production_branch // "main"' .ndf/worktree.json)" >> "$GITHUB_OUTPUT"

  bump:
    needs: branches
    if: >-
      (github.event_name == 'push' && vars.NDF_RELEASE_RUNNER == 'ndf-next') ||
      (github.event_name == 'workflow_dispatch' && inputs.step == 'bump')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    concurrency:
      group: ndf-next-release-main
      cancel-in-progress: false
    outputs:
      state: ${{ steps.bump.outputs.state }}
      revision: ${{ steps.bump.outputs.revision }}
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.NDF_RELEASE_TOKEN }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - id: bump
        name: Make, advance or replace the bump pull request and merge it
        env:
          GH_TOKEN: ${{ secrets.NDF_RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          PRODUCTION: ${{ needs.branches.outputs.production }}
        run: |
          set -o pipefail
          "$NDF" release-steps bump --root . --production "$PRODUCTION" --budget "$CHECK_BUDGET" | tee "$RUNNER_TEMP/bump.json" || code=$?
          echo "state=$(tail -n 1 "$RUNNER_TEMP/bump.json" | jq -r '[.items[]? | select(.kind == "value" and .name == "state") | .value][0] // ""')" >> "$GITHUB_OUTPUT"
          # published のときは、その未公開の版を作った版上げの PR のマージコミット（bump の値 revision）でタグを打つ
          revision="$(tail -n 1 "$RUNNER_TEMP/bump.json" | jq -r '[.items[]? | select(.kind == "value" and .name == "revision") | .value][0] // ""')"
          echo "revision=${revision:-$(git rev-parse "origin/$PRODUCTION")}" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"

  publish:
    # bump が版上げの PR のマージの push（先端の版にタグが無い）を published と読んだとき・bump が何もしなかったとき
    # （not_applicable。今の行ではリリースブランチの PR のマージコミットにタグを作る）か、手動の起動（step=publish）で打つ
    needs: [bump]
    if: >-
      always() &&
      ((needs.bump.outputs.state == 'published') ||
       (github.event_name == 'push' && needs.bump.outputs.state == 'not_applicable') ||
       (github.event_name == 'workflow_dispatch' && inputs.step == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ndf-next-release-main
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      REVISION: ${{ inputs.revision || needs.bump.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}
          path: .ndf-release-tree
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - name: Publish the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$REVISION" in ''|*[!0-9a-f]*) echo "コミットの SHA でない: $REVISION"; exit 2;; esac
          "$NDF" release-steps publish --root .ndf-release-tree --revision "$REVISION"

  rebump:
    # bump が published を返して publish が済んだら、同じ run で bump を打ち直す。版上げの PR のマージ（M）の後・タグの
    # 前に main へ入ったスプリントの PR は、その push の bump も published(M) を返すため、ここで打ち直さないと版上げの
    # PR を作る出来事が残らない（公開の後は M にタグがあり、M より後の変化から版上げの PR を作る）
    needs: [branches, bump, publish]
    if: needs.bump.outputs.state == 'published' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    concurrency:
      group: ndf-next-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.NDF_RELEASE_TOKEN }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - name: Make the bump pull request for the changes after the published bump merge
        env:
          GH_TOKEN: ${{ secrets.NDF_RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          PRODUCTION: ${{ needs.branches.outputs.production }}
        run: |
          "$NDF" release-steps bump --root . --production "$PRODUCTION" --budget "$CHECK_BUDGET"

  assemble:
    needs: branches
    if: github.event_name == 'workflow_dispatch' && inputs.step == 'assemble'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - name: Write the approval materials into the production pull request
        env:
          GH_TOKEN: ${{ secrets.NDF_RELEASE_TOKEN }}
          PR: ${{ inputs.pr }}
          PRODUCTION: ${{ needs.branches.outputs.production }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "PR の番号でない: $PR"; exit 2;; esac
          "$NDF" release-steps assemble --root . --pr "$PR" --production "$PRODUCTION"

  merge:
    needs: branches
    if: github.event_name == 'workflow_dispatch' && inputs.step == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - name: Merge after the approval trail and the required checks
        env:
          GH_TOKEN: ${{ secrets.NDF_RELEASE_TOKEN || github.token }}
          PR: ${{ inputs.pr }}
          PRODUCTION: ${{ needs.branches.outputs.production }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "PR の番号でない: $PR"; exit 2;; esac
          "$NDF" release-steps merge --root . --pr "$PR" --budget "$CHECK_BUDGET" --production "$PRODUCTION"

  approval:
    # 証跡の印を含むコメントの作成・編集・削除だけで起動する。編集は前の本文も見る（印を消した編集でも判定し直す）。
    # 判定とマージは既定ブランチの定義と中身で動き、PR のコードは取り出さない。印・変数・PR の条件は branches が持つ
    needs: branches
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    concurrency:
      group: ndf-next-release-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - id: check
        name: Check the approval trail and post the commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          PRODUCTION: ${{ needs.branches.outputs.production }}
        run: |
          "$NDF" release-steps approval-check --root . --pr "$PR" --production "$PRODUCTION" | tee "$RUNNER_TEMP/check.json" || true
          echo "state=$(tail -n 1 "$RUNNER_TEMP/check.json" | jq -r '[.items[]? | select(.kind == "value" and .name == "state") | .value][0] // ""')" >> "$GITHUB_OUTPUT"
      - name: Merge the approved production pull request
        if: steps.check.outputs.state == 'approved'
        env:
          GH_TOKEN: ${{ secrets.NDF_RELEASE_TOKEN || github.token }}
          PR: ${{ github.event.issue.number }}
          PRODUCTION: ${{ needs.branches.outputs.production }}
        run: '"$NDF" release-steps merge --root . --pr "$PR" --budget "$CHECK_BUDGET" --production "$PRODUCTION"'
