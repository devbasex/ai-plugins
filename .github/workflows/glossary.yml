name: Glossary

# プロジェクトの用語集（.ndf/glossary.json が指すもの）を Pull Request ごとに確かめる。
#
# 11 系の ndf records glossary で、生成した文書が用語集の源と一致し、どのコンテキストも上限の行数に収まること
# （render --check）と、意味の説明に廃止した語が無いこと（meanings）を見る。追加した行の廃止した語は、
# プラグインの中は ndf check の banned-word が見る。
on:
  pull_request:
  # merge queue の一時コミットで必須のチェックを回す（#3672 の手順 3）
  merge_group:

permissions:
  contents: read

jobs:
  glossary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf/uv.lock
      - name: Check that the glossary document matches its source
        run: plugins/ndf/bin/ndf records glossary render --check
      - name: Check the meanings for deprecated words
        run: plugins/ndf/bin/ndf records glossary meanings
