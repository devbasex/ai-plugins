name: Python tests

# Pull Request では絞り込まずに常に起動する。ブランチの ruleset が必須にするチェックは、
# 変更の種類にかかわらず結果を返す必要がある。GitHub は paths で除外された実行を
# 「成功」ではなく「実行されていない」として扱うため、絞り込んだままだと対象外の変更で
# マージ可能にならない。push の側は絞り込みを残す（マージの可否を決めないため）
#
# push の branches に release/** を置かない。release/** から出した Pull Request では
# pull_request の側が必ず回るため、push の側も起動すると同じテストを 2 回回す（#884）。
# main / develop はマージ後の確認として残す
#
# push の絞り込みは pytest . の収集範囲に合わせる。テストの置き場所（plugins / scripts /
# tests）に加えて、収集の仕方そのものを変える根の設定ファイルも対象へ入れる
on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/pytest.yml"
      - "plugins/**"
      - "scripts/**"
      - "tests/**"
      - "conftest.py"
      - "pytest.ini"
      - "pyproject.toml"

# 同じ Pull Request で新しい push が来たら、古い実行を取り消す（#2154・#2291 の決定 5）。
# push（main / develop）は実行ごとに別の組へ入れて最後まで回す。同じ組に新しい実行が入ると、
# 待っている前の実行は cancel-in-progress が false でも取り消され、コミットごとの記録が欠けるため。
# 取り消した実行でも集約のジョブ pytest は always() で走り、古いコミットに失敗を付ける。
# head のコミットのチェックには新しい実行の結果だけが付く
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # デプロイの PR（版数と説明だけの差分、または develop で通ったコミットを進めるだけの main 宛の
  # PR）と、文書のファイルだけの PR では全体のテストを省く（#1055・#2925）。判定は scripts/ci-heavy-skip.py が
  # 差分と develop の push の結果から行う。文書の分け方は NDF の差分の分類（.ndf/project.json の docs）を読み、
  # テストが読む文書があれば docs_tests に対応するテストを出す。push では常に回す
  # （develop で通ったという記録を省かない結果にするため）
  ci-scope:
    name: pytest-scope
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      docs_tests: ${{ steps.decide.outputs.docs_tests }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      # 差分の分類がパスの照合に pathspec を使う。版は根の pyproject.toml の pin から読む（宣言を 2 か所に置かない）
      - uses: actions/setup-python@v7
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.x"
      - if: github.event_name == 'pull_request'
        run: python3 -m pip install --quiet "$(grep -oE 'pathspec==[0-9.]+' pyproject.toml)"
      - id: decide
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci-heavy-skip.py --workflow pytest.yml
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  # ファイル単位で 2 つのジョブへ分けて回す（#882）。割り当ては根の conftest.py が
  # SHARD_TOTAL / SHARD_INDEX から決める。各ジョブの中は -n auto で runner のコア数だけ
  # 並列に回す（pytest-xdist は --project が指す pyproject.toml の依存に入っている）
  pytest-shard:
    name: pytest (${{ matrix.shard }}/2)
    needs: ci-scope
    # 判定が落ちても回す（省くのは判定が skip=true を返したときだけ）
    if: ${{ !cancelled() && needs.ci-scope.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # スライドの生成スクリプトのテストが node で pptxgenjs を動かす。依存の `npm ci` はテストが
      # 自分で打つ（前提のコマンドの確認は根の conftest.py が行う。#2065）
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # uv と依存の取得を uv.lock をキーにしたキャッシュで縮める（#2291 の決定 6）
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # 起点はリポジトリの根に置く。環境は根の pyproject.toml と uv.lock が固定する（#1142 の決定 22）。
      # playwright_kit・plugins/ndf の全グループ（--all-extras）・pytest と pytest-xdist が入り、
      # 包みを呼ぶ側のテストも同じプロセスで外部パッケージを import できる。
      #
      # 前提のコマンドの確認と git の身元の設定は、根の conftest.py が行う。前提を
      # ワークフローの側にも置くと、増えたときに片方だけが更新される
      # 統括役の結合テスト（test_relay_hub.py::TestWithTmux）が tmux を使う。runner のイメージは tmux を
      # 載せると約束していないため、無いときだけ入れる（ある間は時間を足さない。#2346）。apt の索引が古いと
      # 取得で落ちるため、入れる経路では update を install の直前に打つ。版はログに残す
      - name: tmux
        run: |
          command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }
          tmux -V
      # 項目ごとの名前と結果を JUnit XML に残す（ログは -q で件数だけ。#2346）
      - run: uv run --frozen --project . --all-extras pytest . -q -n auto --junitxml=pytest-junit-${{ matrix.shard }}.xml
        env:
          SHARD_TOTAL: 2
          SHARD_INDEX: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-junit-${{ matrix.shard }}
          path: pytest-junit-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # 文書のファイルだけの PR で、テストが読む文書を読むテストだけを回す（#2925）。テストの一覧は判定の出力を
  # 環境変数で渡す（PR の宣言から来る値を式でシェルへ埋めない）
  pytest-docs:
    name: pytest (文書)
    needs: ci-scope
    if: ${{ !cancelled() && needs.ci-scope.outputs.skip == 'true' && needs.ci-scope.outputs.docs_tests != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - env:
          DOCS_TESTS: ${{ needs.ci-scope.outputs.docs_tests }}
        run: |
          read -ra tests <<< "$DOCS_TESTS"
          uv run --frozen --project . --all-extras pytest "${tests[@]}" -q -n auto

  # ruleset の必須のチェックは `pytest` という名前の結果を 1 つ待つ。分けたジョブの結果を
  # ここで 1 つにまとめる。名前を変えると ruleset の変更が要る。
  # always() で分けたジョブが落ちても走らせ、失敗・取り消しを失敗として返す。
  # 判定が省いたときは分けたジョブが skipped になり、文書のテストを出したならその成功を、出さなければ
  # 文書のテストのジョブの skipped を求める
  pytest:
    needs: [ci-scope, pytest-shard, pytest-docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SHARD: ${{ needs.pytest-shard.result }}
          DOCS: ${{ needs.pytest-docs.result }}
          SKIP: ${{ needs.ci-scope.outputs.skip }}
          DOCS_TESTS: ${{ needs.ci-scope.outputs.docs_tests }}
        run: |
          test "$SHARD" = success && exit 0
          test "$SKIP" = true && test "$SHARD" = skipped || exit 1
          if test -n "$DOCS_TESTS"; then test "$DOCS" = success; else test "$DOCS" = skipped; fi
