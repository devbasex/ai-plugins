name: Python tests

# Pull Request では絞り込まずに常に起動する。ブランチの ruleset が必須にするチェックは、
# 変更の種類にかかわらず結果を返す必要がある。GitHub は paths で除外された実行を
# 「成功」ではなく「実行されていない」として扱うため、絞り込んだままだと対象外の変更で
# マージ可能にならない。push の側は絞り込みを残す（マージの可否を決めないため）
#
# push の branches に release/** を置かない。release/** から出した Pull Request では
# pull_request の側が必ず回るため、push の側も起動すると同じテストを 2 回回す（#884）。
# main / develop はマージ後の確認として残す
#
# push の絞り込みは pytest . の収集範囲に合わせる。テストの置き場所（plugins / scripts /
# tests）に加えて、収集の仕方そのものを変える根の設定ファイルも対象へ入れる
on:
  pull_request:
  # merge queue の一時コミットで必須のチェックを回す（#3672 の手順 3）
  merge_group:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/pytest.yml"
      - "plugins/**"
      - "scripts/**"
      - "tests/**"
      - "conftest.py"
      - "pytest.ini"
      - "pyproject.toml"

# 同じ Pull Request で新しい push が来たら、古い実行を取り消す（#2154・#2291 の決定 5）。
# push（main / develop）は実行ごとに別の組へ入れて最後まで回す。同じ組に新しい実行が入ると、
# 待っている前の実行は cancel-in-progress が false でも取り消され、コミットごとの記録が欠けるため。
# 取り消した実行でも集約のジョブ pytest は always() で走り、古いコミットに失敗を付ける。
# head のコミットのチェックには新しい実行の結果だけが付く
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # デプロイの PR（版数と説明だけの差分、または develop で通ったコミットを進めるだけの main 宛の
  # PR）と、文書のファイルだけの PR では全体のテストを省く（#1055・#2925）。判定は scripts/ci-heavy-skip.py が
  # 差分と develop の push の結果から行う。文書の分け方は NDF の差分の分類（.ndf/project.json の docs）を読み、
  # テストが読む文書があれば docs_tests に対応するテストを出す。push では常に回す
  # （develop で通ったという記録を省かない結果にするため）
  ci-scope:
    name: pytest-scope
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      docs_tests: ${{ steps.decide.outputs.docs_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      # 差分の分類がパスの照合に pathspec を使う。版は根の pyproject.toml の pin から読む（宣言を 2 か所に置かない）
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          python-version: "3.12"
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: python3 -m pip install --quiet "$(grep -oE 'pathspec==[0-9.]+' pyproject.toml)"
      - id: decide
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci-heavy-skip.py --workflow pytest.yml
          --base "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          --head "${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}"

  # ファイル単位で 6 つのジョブへ分けて回す（#882。2 から 6 へ増やした: 2026-11-17 の利用者の指示）。割り当ては根の conftest.py が
  # SHARD_TOTAL / SHARD_INDEX から決める。各ジョブの中は -n auto で runner のコア数だけ
  # 並列に回す（pytest-xdist は --project が指す pyproject.toml の依存に入っている）
  #
  # NDF（plugins/ndf/）のテストは同じジョブの後の手順で、プラグインの根を起点にその依存の環境（plugins/ndf/pyproject.toml と
  # uv.lock。docs/specifications/ndf-rebuild.md の決定 78）で回す。根の pytest は plugins/ndf を収集しない（根の conftest.py）。ファイルの割り当ては
  # 同じ scripts/pytest_shard.py で、重さはファイルの項目数（scripts/pytest-shard-seconds.json は根から見たパスの実測秒で、
  # プラグインの根から収集した id と合わない）
  pytest-shard:
    name: pytest (${{ matrix.shard }}/6)
    needs: ci-scope
    # 判定が落ちても回す（省くのは判定が skip=true を返したときだけ）
    if: ${{ !cancelled() && needs.ci-scope.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # スライドの生成スクリプトのテストが node で pptxgenjs を動かす。依存の `npm ci` はテストが
      # 自分で打つ（前提のコマンドの確認は根の conftest.py が行う。#2065）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # uv と依存の取得を uv.lock をキーにしたキャッシュで縮める（#2291 の決定 6）
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            plugins/ndf/uv.lock
      # 起点はリポジトリの根に置く。環境は根の pyproject.toml と uv.lock が固定する（docs/specifications/ndf-rebuild-libraries.md の決定 22）。
      # playwright_kit・plugins/ndf の全グループ（--all-extras）・pytest と pytest-xdist が入り、
      # 包みを呼ぶ側のテストも同じプロセスで外部パッケージを import できる。
      #
      # 前提のコマンドの確認と git の身元の設定は、根の conftest.py が行う。前提を
      # ワークフローの側にも置くと、増えたときに片方だけが更新される
      # 統括役の結合テスト（test_relay_hub.py::TestWithTmux）が tmux を使う。runner のイメージは tmux を
      # 載せると約束していないため、無いときだけ入れる（ある間は時間を足さない。#2346）。apt の索引が古いと
      # 取得で落ちるため、入れる経路では update を install の直前に打つ。版はログに残す
      - name: tmux
        run: |
          command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }
          tmux -V
      # 項目ごとの名前と結果を JUnit XML に残す（ログは -q で件数だけ。#2346）
      - run: uv run --frozen --project . --all-extras pytest . -q -n auto --junitxml=pytest-junit-${{ matrix.shard }}.xml
        env:
          SHARD_TOTAL: 6
          SHARD_INDEX: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-junit-${{ matrix.shard }}
          path: pytest-junit-${{ matrix.shard }}.xml
          if-no-files-found: warn
      # 根のテストが落ちても回す（どちらの失敗も 1 回の実行で見えるようにする）
      - name: NDF のテストのファイルを決める
        if: ${{ !cancelled() }}
        working-directory: plugins/ndf
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          uv run --frozen --project . pytest --collect-only -q > "$RUNNER_TEMP/ndf-collected.txt"
          python3 ../../scripts/pytest_shard.py files --total 6 --index "$SHARD_INDEX" < "$RUNNER_TEMP/ndf-collected.txt" > "$RUNNER_TEMP/ndf-files.txt"
          wc -l < "$RUNNER_TEMP/ndf-files.txt"
      # ok の出力を確かめた副命令の名前を書き出し、pytest-ndf-ok-tools が 6 つを合わせて確かめる
      # （ファイルを渡す実行は全体の実行でないため、plugins/ndf/tests/conftest.py は自分では確かめない）
      - name: NDF のテスト
        if: ${{ !cancelled() }}
        working-directory: plugins/ndf
        env:
          NDF_OK_TOOLS_OUT: ${{ runner.temp }}/ok-tools-${{ matrix.shard }}.txt
        run: xargs -r -a "$RUNNER_TEMP/ndf-files.txt" uv run --frozen --project . pytest -q -n auto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ndf-ok-tools-${{ matrix.shard }}
          path: ${{ runner.temp }}/ok-tools-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 1

  # NDF のテストの全体の実行の終わりの確かめ（ok の出力を 1 度も確かめなかった副命令で落とす。plugins/ndf/tests/conftest.py）を、
  # 分けたジョブの記録を合わせて行う。結果は集約のジョブ pytest が返す
  pytest-ndf-ok-tools:
    name: pytest (NDF の ok の出力)
    needs: pytest-shard
    if: ${{ !cancelled() && needs.pytest-shard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: plugins/ndf/uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ndf-ok-tools-*
          path: ${{ runner.temp }}/ok-tools
          merge-multiple: true
      - name: ok の出力が確かめられない副命令が無いか
        working-directory: plugins/ndf
        run: |
          cat "$RUNNER_TEMP"/ok-tools/ok-tools-*.txt | PYTHONPATH=src uv run --frozen --project . python -c '
          import sys
          from ndf import cli
          missing = sorted(set(cli.COMMANDS) - {line.strip() for line in sys.stdin if line.strip()})
          if missing:
              sys.exit("ok の出力が確かめられない副命令: " + ", ".join(missing))
          '

  # 文書のファイルだけの PR で、テストが読む文書を読むテストだけを回す（#2925）。テストの一覧は判定の出力を
  # 環境変数で渡す（PR の宣言から来る値を式でシェルへ埋めない）
  pytest-docs:
    name: pytest (文書)
    needs: ci-scope
    if: ${{ !cancelled() && needs.ci-scope.outputs.skip == 'true' && needs.ci-scope.outputs.docs_tests != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            plugins/ndf/uv.lock
      - env:
          DOCS_TESTS: ${{ needs.ci-scope.outputs.docs_tests }}
        # plugins/ndf のテストは根の環境では読めない（conftest がプラグインの pythonpath を前提にする）。
        # pytest-shard と同じく、プラグインの根を起点にその依存の環境で流す
        run: |
          read -ra tests <<< "$DOCS_TESTS"
          root=(); ndf=()
          plugin=plugins/ndf/
          for t in "${tests[@]}"; do
            case "$t" in
              "$plugin"*) ndf+=("${t#"$plugin"}") ;;
              *) root+=("$t") ;;
            esac
          done
          if [ ${#root[@]} -gt 0 ]; then
            uv run --frozen --project . --all-extras pytest "${root[@]}" -q -n auto
          fi
          if [ ${#ndf[@]} -gt 0 ]; then
            cd plugins/ndf
            uv run --frozen --project . pytest "${ndf[@]}" -q -n auto
          fi

  # ruleset の必須のチェックは `pytest` という名前の結果を 1 つ待つ。分けたジョブの結果を
  # ここで 1 つにまとめる。名前を変えると ruleset の変更が要る。
  # always() で分けたジョブが落ちても走らせ、失敗・取り消しを失敗として返す。
  # 分けたジョブが通ったら、NDF の ok の出力の確かめ（pytest-ndf-ok-tools）の成功も求める。
  # 判定が省いたときは分けたジョブが skipped になり、文書のテストを出したならその成功を、出さなければ
  # 文書のテストのジョブの skipped を求める
  pytest:
    needs: [ci-scope, pytest-shard, pytest-ndf-ok-tools, pytest-docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SHARD: ${{ needs.pytest-shard.result }}
          OK_TOOLS: ${{ needs.pytest-ndf-ok-tools.result }}
          DOCS: ${{ needs.pytest-docs.result }}
          SKIP: ${{ needs.ci-scope.outputs.skip }}
          DOCS_TESTS: ${{ needs.ci-scope.outputs.docs_tests }}
        run: |
          test "$SHARD" = success && { test "$OK_TOOLS" = success; exit; }
          test "$SKIP" = true && test "$SHARD" = skipped || exit 1
          if test -n "$DOCS_TESTS"; then test "$DOCS" = success; else test "$DOCS" = skipped; fi
