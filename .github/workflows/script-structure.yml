name: Script structure

# NDF のスクリプトの構造チェック（#1142 の I4・I5）。テストを除くスクリプトの 1000 行を超えるファイルと、
# 本体の同じ関数・同じ名前で本体の違う関数を数え、scripts/script-structure-allow/ の例外のほかに
# 当たれば落とす。例外リストの使われない項目も落とす（直した Pull Request が同じ差分でその項目のファイルを消す）。
#
# 同じワークフローの ndf-contracts-check は、エントリポイントの契約の一覧（plugins/ndf/contracts/）とコードを
# 突き合わせ、scripts/contract-allow/ の例外のほかに当たれば落とす。例外リストはベースブランチとの
# merge-base より増えると落とすため、履歴をすべて取る（fetch-depth: 0）。11.0 の契約（plugins/ndf-next/contracts/）を正本とする
# 10 系のコピー（ブランチ戦略のスキーマの定義・既定の表・移す行の表・作成の結果のスキーマ）が 1 バイトでも違えば落とす（#3681）。
#
# script-structure-check の 2 つ目の手順は、#3672 の削除の一覧（scripts/legacy-branch-decl.json）の各行のパスに、旧いブランチ
# 戦略の宣言のキーが残っていないかを照らす（受け入れ条件 21）。
#
# script-structure-check の後半の手順は、Issue の記載項目の定義（plugins/ndf/scripts/data/issue-items.json）と、
# GitHub のフォーム・out-of-scope の本文の骨格・仕様のテンプレートが食い違っていないかを確かめる（#2737 の一致の検査）。
#
# script-structure-check の最後の 2 つの手順は、外からの参照（plugins/ndf/ の外から plugins/ndf/ の中を名指すパス）を
# scripts/check-plugin-refs.py で確かめる（#3341 の決定 1）。今のツリーで参照先が実在するかと、plugins/ndf-next/ を
# plugins/ndf/ と読み替えて書き換えの表（scripts/plugin-refs-swap.json）を当てた後に実在するか。表に無い参照を足すと落ちる。
# 入れ替えの PR が表を当てた後に、表と --tree swapped の手順を消す（--tree current の手順は残す）
#
# Pull Request では絞り込まずに常に起動する（pytest.yml と同じ理由）。数秒で終わる
on:
  pull_request:
  # merge queue の一時コミットで必須のチェックを回す（#3672 の手順 3）
  merge_group:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/script-structure.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "plugins/ndf/**"
      - "plugins/ndf-next/contracts/**"
      - "scripts/check-script-structure.py"
      - "scripts/script-structure-allow/**"
      - "scripts/check-ndf-contracts.py"
      - "scripts/contracts_lib/**"
      - "scripts/contract-allow/**"
      - "scripts/check-legacy-branch-decl.py"
      - "scripts/legacy-branch-decl.json"
      - "scripts/tests/**"
      - "scripts/check-plugin-refs.py"
      - "scripts/plugin-refs-swap.json"

permissions:
  contents: read

jobs:
  script-structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Check the script structure
        run: python3 scripts/check-script-structure.py
      - name: Check that the legacy branch declaration keys are removed
        run: python3 scripts/check-legacy-branch-decl.py
      # フォームの YAML と Markdown を読む部品は uv の環境から入る（deps.require が uv.lock の環境で起動し直す）。
      # swapped の検査は plugins/ndf-next の lock で同期するため、両方の lock をキャッシュのキーに入れる
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            plugins/ndf-next/uv.lock
      - name: Check the issue templates against the issue items
        run: python3 plugins/ndf/scripts/issue-items.py templates --root .
      - name: Check the references into plugins/ndf on the current tree
        run: python3 scripts/check-plugin-refs.py check --tree current
      # 行き先の副命令の有無を、plugins/ndf-next の環境を 1 回だけ uv run で起動し、各副命令の --help でまとめて確かめる
      - name: Check the references into plugins/ndf on the swapped tree
        run: python3 scripts/check-plugin-refs.py check --tree swapped

  ndf-contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # 起点はイベントから決める（Pull Request は宛先、push は送った先のブランチ）。宣言を読む経路（jsonschema が要る）へ進めない
      - name: Check the NDF entrypoint contracts
        run: python3 scripts/check-ndf-contracts.py --base "origin/${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
