name: Runtime plugin validation

# Pull Request では絞り込まずに常に起動する。ブランチの ruleset が必須にするチェックは、
# 変更の種類にかかわらず結果を返す必要がある。GitHub は paths で除外された実行を
# 「成功」ではなく「実行されていない」として扱うため、絞り込んだままだと対象外の変更で
# マージ可能にならない。push の側は絞り込みを残す（マージの可否を決めないため）
on:
  pull_request:
  # merge queue の一時コミットで必須のチェックを回す（#3672 の手順 3）
  merge_group:
  push:
    branches:
      - main
      - develop
    paths:
      - ".claude-plugin/**"
      - ".github/workflows/runtime-plugin-validate.yml"
      - ".githooks/**"
      - ".ndf/**"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "KIRO.md"
      - "README.md"
      - "docs/**"
      - "issues/**"
      - "plugins/**"
      - "scripts/**"

jobs:
  runtime-plugin-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: bash scripts/build-runtime-plugins.sh --check

  skill-frontmatter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python3 scripts/check-skill-frontmatter.py

  skill-repo-assumptions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python3 scripts/check-skill-repo-assumptions.py

  skill-shell-vars-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python3 scripts/check-skill-shell-vars.py

  repo-secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python3 scripts/check-repo-secrets.py

  runtime-plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: npm install -g @anthropic-ai/claude-code
      - run: bash scripts/validate-runtime-plugins.sh

  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python3 scripts/check-markdown-links.py --root .
      # Skill とエージェントの本文に残る 10 系のスクリプトの呼び出しを、一覧の数に固定する（#3799）
      - run: python3 scripts/check-legacy-script-calls.py --root .

  doc-line-limit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python3 scripts/check-doc-line-limit.py --root .

  # ワークフローのジョブから決まるチェックの名前と、宛先のブランチの必須のチェックを突き合わせる（#653）。
  # 宛先のブランチは Pull Request でしか決まらないため、push では起動しない。必須の一覧は読むだけで書き込まない
  required-checks-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/check-required-checks.py
          --repo "${{ github.repository }}" --branch "${{ github.base_ref }}"
