name: Runtime plugin authenticated smoke

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime to test
        required: true
        default: all
        type: choice
        options:
          - all
          - claude
          - codex

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    environment: runtime-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run authenticated runtime smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bash scripts/runtime-smoke-test.sh --runtime "${{ inputs.runtime }}" --with-secrets=auto
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-smoke-authenticated
          path: tmp/runtime-smoke
