name: Runtime plugin authenticated smoke

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime to test
        required: true
        default: all
        type: choice
        options:
          - all
          - claude
          - codex
          - kiro
          - agy

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    environment: runtime-smoke
    steps:
      - uses: actions/checkout@v7
      - name: Run authenticated runtime smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bash scripts/runtime-smoke-test.sh --runtime "${{ inputs.runtime }}" --with-secrets=auto
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-smoke-authenticated
          path: tmp/runtime-smoke
