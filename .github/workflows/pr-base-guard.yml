name: PR base branch guard

# すべての Pull Request で起動する。ブランチの ruleset が必須にするチェックは、変更の種類にも
# 宛先にもかかわらず結果を返す必要がある。判定そのものは既定ブランチ宛のときだけ行う
# （開発の起点ブランチ宛の Pull Request には、この判定が当てはまらない）
on:
  pull_request:
  # merge queue の一時コミットで必須のチェックを回す（#3672 の手順 3）
  merge_group:

jobs:
  guard:
    # PR の本文・宛先・head を読むため、merge queue では飛ばす（PR で通っている）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release/v* の head がベースブランチの祖先か（release_branch ではスプリントブランチの祖先か）を
          # git merge-base で判定するため、履歴をすべて取る
          fetch-depth: 0
      # 宛先のブランチの宣言を読む部品（NDF の core/branch_strategy.py）は NDF の依存を uv の環境で読む
      - uses: astral-sh/setup-uv@v10.3.3
        if: github.base_ref == github.event.repository.default_branch
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf/uv.lock
      - name: Check the branch this pull request came from
        # 宛先が既定ブランチでなければ、チェックは行わずに成功で終わる。既定ブランチの名前は
        # ワークフローへ書かず、リポジトリの設定から受け取る
        if: github.base_ref == github.event.repository.default_branch
        # ブランチ名をそのままシェルの本文へ埋めない。名前に置換の記法を含められる。
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 宛先のブランチの .ndf/project.json のセクション branch_strategy で判定を選ぶ。head 側の宣言は読まない（#3672 の D27）
          PR_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-pr-base.sh "$HEAD_REF" "$HEAD_SHA"
