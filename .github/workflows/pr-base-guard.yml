name: PR base branch guard

# すべての Pull Request で起動する。ブランチの ruleset が必須にするチェックは、変更の種類にも
# 宛先にもかかわらず結果を返す必要がある。判定そのものは既定ブランチ宛のときだけ行う
# （開発の起点ブランチ宛の Pull Request には、この判定が当てはまらない）
on:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release/v* の head が起点ブランチの祖先か（選んで集める取り込み方ではスプリントブランチの祖先か）を
          # git merge-base で判定するため、履歴をすべて取る
          fetch-depth: 0
      - name: Check the branch this pull request came from
        # 宛先が既定ブランチでなければ、チェックは行わずに成功で終わる。既定ブランチの名前は
        # ワークフローへ書かず、リポジトリの設定から受け取る
        if: github.base_ref == github.event.repository.default_branch
        # ブランチ名をそのままシェルの本文へ埋めない。名前に置換の記法を含められる。
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 宛先のブランチの宣言（branch_flow）で判定を選ぶ。head 側の宣言は読まない（#3121 の決定 12）
          PR_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-pr-base.sh "$HEAD_REF" "$HEAD_SHA"
