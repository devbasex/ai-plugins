name: Runtime plugin smoke

# Pull Request では絞り込まずに常に起動する。ブランチの ruleset が必須にする検査は、
# 変更の種類にかかわらず結果を返す必要がある。GitHub は paths で除外された実行を
# 「成功」ではなく「実行されていない」として扱うため、絞り込んだままだと対象外の変更で
# マージ可能にならない。push の側は絞り込みを残す（マージの可否を決めないため）
on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "plugins/**"
      - "scripts/runtime-smoke-test.sh"
      - "tests/runtime-smoke/**"
      - ".github/workflows/runtime-plugin-smoke.yml"

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [claude, codex, kiro, agy]
    steps:
      - uses: actions/checkout@v4
      - name: Run unauthenticated runtime smoke
        run: bash scripts/runtime-smoke-test.sh --runtime "${{ matrix.runtime }}" --with-secrets=off
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-smoke-${{ matrix.runtime }}
          path: tmp/runtime-smoke/${{ matrix.runtime }}
