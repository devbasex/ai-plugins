name: Runtime plugin smoke

# Pull Request では絞り込まずに常に起動する。ブランチの ruleset が必須にするチェックは、
# 変更の種類にかかわらず結果を返す必要がある。GitHub は paths で除外された実行を
# 「成功」ではなく「実行されていない」として扱うため、絞り込んだままだと対象外の変更で
# マージ可能にならない。push の側は絞り込みを残す（マージの可否を決めないため）
on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths:
      - "plugins/**"
      - "scripts/runtime-smoke-test.sh"
      - "tests/runtime-smoke/**"
      - ".github/workflows/runtime-plugin-smoke.yml"

jobs:
  # デプロイの PR（版数と説明だけの差分、または develop で通ったコミットを進めるだけの main 宛の
  # PR）と、文書のファイルだけの PR では smoke を省く（#1055・#2925）。判定は scripts/ci-heavy-skip.py が行う。
  # Skill の本文などの振る舞いを決める文書は frontmatter がランタイムの読み込みを変えるため、コードとして扱う
  # （#2925 の決定 8）。push では常に回す
  ci-scope:
    name: runtime-smoke-scope
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      # 差分の分類がパスの照合に pathspec を使う。版は根の pyproject.toml の pin から読む
      - uses: actions/setup-python@v7
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.x"
      - if: github.event_name == 'pull_request'
        run: python3 -m pip install --quiet "$(grep -oE 'pathspec==[0-9.]+' pyproject.toml)"
      - id: decide
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci-heavy-skip.py --workflow runtime-plugin-smoke.yml
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  # 省くときもジョブは起動し、ステップだけを飛ばして成功を返す。ruleset の必須のチェックは
  # matrix を展開した名前（runtime-smoke (claude) など）を待つ。ジョブごと飛ばすと
  # matrix が展開されず、その名前の結果が返らない
  runtime-smoke:
    needs: ci-scope
    # 判定が落ちても回す（省くのは判定が skip=true を返したときだけ）
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [claude, codex]
    env:
      SKIP_HEAVY: ${{ needs.ci-scope.outputs.skip == 'true' }}
    steps:
      - name: Skip (version and description or documents only)
        if: env.SKIP_HEAVY == 'true'
        run: echo "判定が重いジョブを省いた（ci-scope の出力を見る）"
      - uses: actions/checkout@v7
        if: env.SKIP_HEAVY != 'true'
      - name: Run unauthenticated runtime smoke
        if: env.SKIP_HEAVY != 'true'
        run: bash scripts/runtime-smoke-test.sh --runtime "${{ matrix.runtime }}" --with-secrets=off
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always() && env.SKIP_HEAVY != 'true'
        with:
          name: runtime-smoke-${{ matrix.runtime }}
          path: tmp/runtime-smoke/${{ matrix.runtime }}
