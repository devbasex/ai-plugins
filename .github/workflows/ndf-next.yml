name: ndf-next

# 作り直しの NDF（plugins/ndf-next/。#1142）のテストと検査。入れ替え（S2）の PR がこのファイルを消す。
# 必須のチェックにしないため、Pull Request でも paths で絞る（変えていない PR で回さない）。
# plugins/ndf/** の PR でも検査を打つ（規則 port: 移す先の Issue か移さない理由を本文に持つ。#3343）。
# そのときテストと一時コピーは ndf-next-scope が飛ばし、検査は port だけを当てる（新しいプラグインの側に残る違反で落とさない）
# edited: 検査の I2 と port は PR 本文の印を読むため、本文を直したときも打ち直す
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".github/workflows/ndf-next.yml"
      - "plugins/ndf-next/**"
      - "plugins/ndf/**"
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ndf-next.yml"
      - "plugins/ndf-next/**"

permissions:
  contents: read

env:
  # 新しいプラグインを変えたかを見るパス（リポジトリの根から）。ndf-next-scope と ndf-next-checks が読む
  NEXT_PATHS: plugins/ndf-next .github/workflows/ndf-next.yml

concurrency:
  # 本文の編集（edited）は検査だけを打ち直すため、push の実行（テストを含む）を取り消さないよう別の組にする
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: plugins/ndf-next

jobs:
  # 新しいプラグイン（とこの定義）を変えたか。plugins/ndf だけの PR ではテストと一時コピーを打たない
  # 本文の編集（edited）では出力を読むジョブがどれも飛ぶので、判定も打たない
  ndf-next-scope:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.diff.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] \
            || git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- $NEXT_PATHS | grep -q .; then
            echo next=true >> "$GITHUB_OUTPUT"
          else
            echo next=false >> "$GITHUB_OUTPUT"
          fi

  # 依存の環境は plugins/ndf-next/pyproject.toml と uv.lock が固定する（決定 78）。
  # 起点を plugins/ndf-next に置き、テストの基準のディレクトリを根の pytest.ini から切り離す
  ndf-next-tests:
    # PR 本文を読まないので、本文の編集では流し直さない
    needs: ndf-next-scope
    if: github.event.action != 'edited' && needs.ndf-next-scope.outputs.next == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - run: uv run --frozen --project . pytest -q -n auto

  ndf-next-checks:
    runs-on: ubuntu-latest
    steps:
      # 検査の I2 が起点との merge-base を求めるため、履歴をすべて取る
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      # lock が宣言と食い違っていないか
      - run: uv lock --check --project .
      # Claude Code 用と Codex 用の定義が同じ名前と版を持つか
      - run: >-
          python3 -c 'import json, sys;
          a, b = (json.load(open(p)) for p in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json"));
          diff = [k for k in ("name", "version") if a.get(k) != b.get(k)];
          sys.exit(f"plugin.json の食い違い: {diff}" if diff else 0)'
      - run: bash -n bin/ndf
      # 新しいプラグインだけを見る検査（src/ndf/checks/README.md）。Pull Request では起点からの差分（I2）も見る。
      # PR 本文（即時修正の印）は GitHub が渡す GITHUB_EVENT_PATH から読む。
      # main へのリリースの PR は develop で I2 を通った差分を束ねるだけなので、I2 を当てない。
      # 新しいプラグインを変えていない PR（plugins/ndf だけ）は port だけを当てる。本文の編集（edited）でも
      # 判定が要るので、ndf-next-scope の出力（edited では飛ぶ）を読まずにここで NEXT_PATHS の差分を見る
      - run: |
          if [ -n "${GITHUB_BASE_REF:-}" ] && [ "$GITHUB_BASE_REF" != main ]; then
            only=()
            # shellcheck disable=SC2086 # NEXT_PATHS はパスを空白で区切った一覧
            git -C "$GITHUB_WORKSPACE" diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- $NEXT_PATHS | grep -q . || only=(--only port)
            bin/ndf check --base "origin/$GITHUB_BASE_REF" "${only[@]}"
          else
            bin/ndf check
          fi

  # 名前を入れ替えの後の形（ディレクトリ plugins/ndf・plugin.json の name は identity.FINAL_NAME）にした一時コピーで、
  # 検査とテストを打つ（#3347 の決定 101・IG3）。I1 の指摘の集合（プラグインの根からの相対パスと行）が元と一致し、
  # テストが通ることを確かめる。ディレクトリ名を組み立てた文字列のパスは、コピーの中でテストが落とす
  ndf-next-copy:
    needs: ndf-next-scope
    if: github.event.action != 'edited' && needs.ndf-next-scope.outputs.next == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - name: 一時コピーを作る
        run: |
          copy="$RUNNER_TEMP/copy/plugins/ndf"
          mkdir -p "$(dirname "$copy")"
          cp -R . "$copy"
          # src/ndf はパッケージとして入れない（pyproject.toml の tool.uv）ので、src をパスへ足して読む
          PYTHONPATH=src uv run --frozen --project . python - "$copy" <<'EOF'
          import json, pathlib, sys
          from ndf import identity
          for rel in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json"):
              path = pathlib.Path(sys.argv[1], rel)
              data = json.loads(path.read_text(encoding="utf-8"))
              data["name"] = identity.FINAL_NAME
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          EOF
          git -C "$RUNNER_TEMP/copy" init -q
          git -C "$RUNNER_TEMP/copy" add -A
          git -C "$RUNNER_TEMP/copy" -c user.name=ci -c user.email=ci@example.invalid commit -qm copy
          echo "COPY=$copy" >> "$GITHUB_ENV"
      - name: I1 の指摘の集合が元とコピーで一致するか
        run: |
          bin/ndf check > "$RUNNER_TEMP/orig.out" || true
          (cd "$COPY" && bin/ndf check) > "$RUNNER_TEMP/copy.out" || true
          python3 - "$RUNNER_TEMP/orig.out" plugins/ndf-next/ "$RUNNER_TEMP/copy.out" plugins/ndf/ <<'EOF'
          import json, sys
          def i1(out, prefix):
              report = json.loads(open(out, encoding="utf-8").read().strip().splitlines()[-1])
              if report["status"] == "stopped" and report["cause"]["kind"] != "check_failed":
                  sys.exit(f"検査が止まった（{out}）: {report['summary']}")
              return {(i["path"].removeprefix(prefix), i["line"]) for i in report["items"] if i["rule"] == "I1"}
          orig, copy = i1(sys.argv[1], sys.argv[2]), i1(sys.argv[3], sys.argv[4])
          for label, rows in (("元だけ", orig - copy), ("コピーだけ", copy - orig)):
              for path, line in sorted(rows):
                  print(f"{label}: I1 {path}:{line}", file=sys.stderr)
          sys.exit(1 if orig != copy else 0)
          EOF
      # 全件を打つ。ディレクトリ名・プラグイン名を組み立てた文字列はどのテストからも作れ、触れるテストを
      # 絞る一覧は新しいモジュールの追加で古くなる（決定 101 は「テストが通ること」を確かめる）。
      # 実測（PR #3443 の run 43581413222）: ndf-next-tests 74 秒・このジョブ 100 秒（コピーと I1 の照合を含む）。
      # 並べて走るため待ち時間の増えは約 26 秒、runner の時間は 1 回あたり約 100 秒増える
      - name: コピーでテストを打つ
        working-directory: ${{ env.COPY }}
        run: uv run --frozen --project . pytest -q -n auto
