name: Deps weekly

# 依存の週 1 回の検査と、Renovate の設定を変えた Pull Request の検証（#3370 #3691。詳細設計は
# issues/issue-3370-3691-design-detail.md の「サプライチェーンの検査のワークフロー」）。
#
# supply-chain-report: 対象の lock（追跡している lock から .github/renovate.json の ignorePaths を除いたもの）の脆弱性
# （uv audit・npm audit）と、解いてよい固定（Renovate の固定の規則の欄と、相手の採用できる版の requires_dist）と、
# プレリリースを選べる依存を集め、本文の目印と作成者で引いた 1 件の Issue を作る・書き直す・閉じる（決定 9・不変条件 I2）。
# 取得が 1 つでも失敗したら Issue に触れずに失敗で終わる（不変条件 I11）。Pull Request では走らない（不変条件 I5）
#
# renovate-config: .github/renovate.json か .github/renovate-version を変えた Pull Request でだけ走る（必須にしない。
# scripts/required-checks-allow.json の not_required）。宛先の先頭（HEAD^1）の検証器（scripts/plugin-deps.py。PR のコードで
# ない）で Renovate の版が公開から 7 日たったことを確かめてから、その版の renovate-config-validator --strict で設定全体を
# 検証する（#3370 の受け入れ条件 6・決定 2）。宛先に検証器が無ければ止まる（PR のコードへ戻さない）
on:
  schedule:
    # 毎週月曜 09:00 JST。定期の起動は既定ブランチ（main）の workflow で動く
    - cron: "0 0 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/renovate.json"
      - ".github/renovate-version"

permissions:
  contents: read

jobs:
  supply-chain-report:
    # 同じワークフローに Pull Request で走るジョブを足しても、このジョブは定時と手動に限る（I5）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # 定時と手動の実行が重なっても 1 つずつ走らせ、知らせの Issue を 2 件にしない
    concurrency:
      group: supply-chain-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Report vulnerabilities and holds that can be released
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --project . python scripts/plugin-deps.py report

  renovate-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-config-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # 宛先の先頭（HEAD^1）の検証器を取り出すため、マージのコミットと第 1 親の 2 世代を取る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # 版はシェルへ ${{ }} で展開せず、ファイルから読んで形を確かめてから出力に置く
      - name: Read the Renovate version
        id: version
        run: |
          version=$(cat .github/renovate-version)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.github/renovate-version の版の形が ^[0-9]+\\.[0-9]+\\.[0-9]+\$ でない"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the Renovate version is at least 7 days old with the base checker
        env:
          RENOVATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          checker="$RUNNER_TEMP/plugin-deps.py"
          if ! git show HEAD^1:scripts/plugin-deps.py > "$checker"; then
            echo "::error::宛先の先頭（HEAD^1）に scripts/plugin-deps.py が無い。PR のコードの検証器では確かめない"
            exit 1
          fi
          python3 "$checker" age --root "$GITHUB_WORKSPACE" --renovate-version "$RENOVATE_VERSION"
      # Renovate 44 は node の ^24.11.0 か ^26.13.0 を求める（package.json の engines）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate the Renovate config with the same version
        env:
          RENOVATE_VERSION: ${{ steps.version.outputs.version }}
        run: npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator --strict --no-global .github/renovate.json
