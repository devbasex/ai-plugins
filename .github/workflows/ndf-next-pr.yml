name: ndf-next pull request

# 作り直しの NDF（plugins/ndf-next/）のリリースのうち、PR の出来事で動く仕事（#3572）。版上げ・タグ・マージは ndf-next-release.yml。
#
# - pull_request: pr-check（main 宛ての PR が版数を変えていないか・上げ幅のラベルが 1 つ以下か・head が検証の ref でないか）。
#   宛先が本番ブランチでない PR と、取り込み方の行が github-flow でない宣言では、副命令が何も見ずに通す。PR 側の定義で動くため、
#   秘密を渡さない（github.token の読み取りだけ）
# - pull_request_target と workflow_dispatch: verify-ref（main 宛ての開いた PR を集めた検証の ref を組み直す）。workflow と ndf は
#   既定ブランチの先端のものだけを使い、PR の先端はデータとして取り込んでマージするだけで、PR の木のスクリプト・依存の導入・hook を
#   実行しない。秘密 NDF_RELEASE_TOKEN は push の認証だけに使う
#
# 宛先のブランチで絞らない（必須のチェックの照合 check-required-checks.py がどの宛先の PR でもこのジョブを知るため）。
# 入れ替え（S2 #3304）までは、出来事での起動をリポジトリの変数 NDF_RELEASE_RUNNER が ndf-next のときだけにする。
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, synchronize, reopened, closed, ready_for_review]

permissions:
  contents: read

env:
  NDF: plugins/ndf-next/bin/ndf

jobs:
  pr-check:
    # PR 側の定義と木で動く。秘密を持たない（github.token の読み取りだけ）
    if: github.event_name == 'pull_request' && vars.NDF_RELEASE_RUNNER == 'ndf-next'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - name: Check the version, the level label and the verify ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: '"$NDF" release-steps pr-check --root . --pr "$PR"'

  verify-ref:
    # main の先端の定義と ndf だけを使う。PR の先端はデータとして取り込んでマージするだけで実行しない
    if: >-
      (github.event_name == 'pull_request_target' && vars.NDF_RELEASE_RUNNER == 'ndf-next') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ndf-next-verify
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: plugins/ndf-next/uv.lock
      - name: Rebuild the verify ref
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          RELEASE_TOKEN: ${{ secrets.NDF_RELEASE_TOKEN }}
        run: |
          # push の認証だけに NDF_RELEASE_TOKEN を渡す（取り出しは persist-credentials: false）
          basic=$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          "$NDF" release-steps verify-ref --root .
